name: Code coverage report to job summary
description: >-
    Appends a code coverage report to the job summary: the total with an indicator and a bar, a
    table per Go package or directory, and a collapsed per-file table. Reads a Go coverprofile or
    an lcov report. Fails with an error annotation when the report is missing or empty.

inputs:
    format:
        description: Report format, 'go' (coverprofile) or 'lcov'.
        required: true
    coverage-file:
        description: Path to the coverage report.
        required: true
    title:
        description: Summary heading.
        required: true
    group-depth:
        description: >-
            Leading directory components a group keeps; 0 groups by the whole directory, i.e. one
            group per Go package.
        required: false
        default: "0"
    strip-prefix:
        description: Removed from the start of every path in the report, e.g. the Go module path.
        required: false
        default: ""
    link-prefix:
        description: Prepended to a report path to make it repository-relative for file links.
        required: false
        default: ""
    excluded:
        description: Comma-separated paths or patterns left out of the report, listed under the total.
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Write code coverage report to the job summary
          shell: bash
          env:
              COVERAGE_FORMAT: ${{ inputs.format }}
              COVERAGE_FILE: ${{ inputs.coverage-file }}
              SUMMARY_TITLE: ${{ inputs.title }}
              GROUP_DEPTH: ${{ inputs.group-depth }}
              STRIP_PREFIX: ${{ inputs.strip-prefix }}
              LINK_PREFIX: ${{ inputs.link-prefix }}
              EXCLUDED: ${{ inputs.excluded }}
          run: |
              set -euo pipefail

              main() {
                  local format coverage_file summary_file work
                  format="${COVERAGE_FORMAT:?COVERAGE_FORMAT is required}"
                  coverage_file="${COVERAGE_FILE:?COVERAGE_FILE is required}"
                  summary_file="${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is not set}"
                  : "${SUMMARY_TITLE:?SUMMARY_TITLE is required}"

                  if [[ ! -s "$coverage_file" ]]; then
                      echo "::error title=Coverage report not found::${coverage_file} is missing or empty. The test step before this one must write it; check its coverage flags."
                      exit 1
                  fi

                  mkdir -p "$HOME/Temp/opencode"
                  work="$(mktemp -d "$HOME/Temp/opencode/coverage-summary.XXXXXX")"
                  # shellcheck disable=SC2064 # expand now: work is local to main.
                  trap "rm -rf '$work'" EXIT

                  case "$format" in
                      go) parse_go "$coverage_file" >"$work/files.tsv" ;;
                      lcov) parse_lcov "$coverage_file" >"$work/files.tsv" ;;
                      *)
                          echo "::error title=Unknown coverage format::COVERAGE_FORMAT is '${format}'. Set the 'format' input of coverage-summary to 'go' or 'lcov'."
                          exit 1
                          ;;
                  esac

                  if [[ ! -s "$work/files.tsv" ]]; then
                      echo "::error file=${coverage_file},title=Coverage report has no files::${coverage_file} lists no source files. Check that the tests ran with coverage enabled and that the ignore patterns do not drop every file."
                      exit 1
                  fi

                  group_records "$work/files.tsv" >"$work/groups.tsv"
                  render "$work/files.tsv" "$work/groups.tsv" >>"$summary_file"
              }

              # parse_go prints one record per file from a Go coverprofile. A block line is
              # 'file:startLine.col,endLine.col numStmts count'. With -coverpkg each test binary reports every
              # block, so a block repeats once per tested package: it is counted once and is covered when any
              # of its counts is above zero, as 'go tool cover' merges them.
              parse_go() {
                  awk -v strip="${STRIP_PREFIX:-}" '
                      NR == 1 && /^mode:/ { next }
                      NF != 3 { next }
                      {
                          key = $1
                          if (!(key in stmts)) {
                              stmts[key] = $2
                              file = key
                              sub(/:[^:]*$/, "", file)
                              file_of[key] = file
                          }
                          if ($3 > 0) covered[key] = 1
                      }
                      END {
                          for (key in stmts) {
                              file = file_of[key]
                              total[file] += stmts[key]
                              if (key in covered) hit[file] += stmts[key]
                          }
                          for (file in total) {
                              path = file
                              if (strip != "" && index(path, strip) == 1) path = substr(path, length(strip) + 1)
                              printf "%s\t%d\t%d\t-1\t-1\n", path, hit[file], total[file]
                          }
                      }
                  ' "$1"
              }

              # parse_lcov prints one record per file from an lcov report, from its LF/LH (lines) and FNF/FNH
              # (functions) records.
              parse_lcov() {
                  awk -F: -v strip="${STRIP_PREFIX:-}" '
                      $1 == "SF" {
                          path = substr($0, 4)
                          if (strip != "" && index(path, strip) == 1) path = substr(path, length(strip) + 1)
                          lf = 0; lh = 0; fnf = 0; fnh = 0
                      }
                      $1 == "LF" { lf = $2 }
                      $1 == "LH" { lh = $2 }
                      $1 == "FNF" { fnf = $2 }
                      $1 == "FNH" { fnh = $2 }
                      $1 == "end_of_record" && path != "" {
                          printf "%s\t%d\t%d\t%d\t%d\n", path, lh, lf, fnh, fnf
                          path = ""
                      }
                  ' "$1"
              }

              # group_records sums the per-file records 'path hit total fn_hit fn_total' (function counts are
              # -1 when the format has none) into one record per group.
              group_records() {
                  awk -F'\t' -v depth="${GROUP_DEPTH:-0}" '
                      {
                          n = split($1, parts, "/")
                          keep = n - 1
                          if (depth > 0 && depth < keep) keep = depth
                          group = keep > 0 ? parts[1] : "."
                          for (i = 2; i <= keep; i++) group = group "/" parts[i]
                          hit[group] += $2; total[group] += $3; fn_hit[group] += $4; fn_total[group] += $5
                          if ($4 < 0) no_fn[group] = 1
                      }
                      END {
                          for (group in total) {
                              if (group in no_fn) { fn_hit[group] = -1; fn_total[group] = -1 }
                              printf "%s\t%d\t%d\t%d\t%d\n", group, hit[group], total[group], fn_hit[group], fn_total[group]
                          }
                      }
                  ' "$1"
              }

              # render prints the markdown summary from the per-file and the per-group records.
              render() {
                  local records="$1" groups="$2" has_functions=0 group_label="Package"
                  if awk -F'\t' '$5 >= 0 { found = 1 } END { exit !found }' "$records"; then
                      has_functions=1
                  fi
                  if [[ "$COVERAGE_FORMAT" != "go" ]]; then
                      group_label="Directory"
                  fi

                  awk -F'\t' -v title="$SUMMARY_TITLE" -v unit="$(unit_name)" -v has_fn="$has_functions" \
                      -v excluded="${EXCLUDED:-}" "$(awk_helpers)"'
                      { hit += $2; total += $3; if ($5 >= 0) { fn_hit += $4; fn_total += $5 } }
                      END {
                          print "## " title
                          print ""
                          line = indicator(hit, total) " **" pct_text(hit, total) "** `" bar(hit, total) "` " unit " (" hit " / " total ")"
                          if (has_fn) line = line "<br>" indicator(fn_hit, fn_total) " **" pct_text(fn_hit, fn_total) "** `" bar(fn_hit, fn_total) "` functions (" fn_hit " / " fn_total ")"
                          print line
                          print ""
                          if (excluded != "") {
                              n = split(excluded, items, ",")
                              text = ""
                              for (i = 1; i <= n; i++) {
                                  item = items[i]
                                  gsub(/^ +| +$/, "", item)
                                  if (item != "") text = text (text == "" ? "" : ", ") "`" item "`"
                              }
                              print "Excluded from coverage: " text
                              print ""
                          }
                      }
                  ' "$records"

                  print_table "$groups" "$group_label" "$has_functions" 0

                  echo "<details>"
                  echo "<summary>Coverage by file ($(wc -l <"$records" | tr -d ' ') files, lowest first)</summary>"
                  echo
                  print_table "$records" "File" "$has_functions" 1
                  echo "</details>"
                  echo
              }

              # print_table prints a markdown table of records sorted by line coverage, lowest first, then by
              # path. With link=1 the path links to the file at the current commit.
              print_table() {
                  local rows="$1" label="$2" has_functions="$3" link="$4"
                  awk -F'\t' '{ printf "%.6f\t%s\n", ($3 > 0 ? $2 / $3 : 1), $0 }' "$rows" |
                      LC_ALL=C sort -t "$(printf '\t')" -k1,1n -k2,2 |
                      cut -f2- |
                      awk -F'\t' -v label="$label" -v unit_title="$(unit_title)" -v has_fn="$has_functions" \
                          -v link="$link" -v link_prefix="${LINK_PREFIX:-}" -v server="${GITHUB_SERVER_URL:-}" \
                          -v repository="${GITHUB_REPOSITORY:-}" -v sha="${GITHUB_SHA:-}" "$(awk_helpers)"'
                          NR == 1 {
                              header = "| " label " | " unit_title " | Coverage |"
                              rule = "| --- | ---: | --- |"
                              if (has_fn) { header = header " Functions | Function coverage |"; rule = rule " ---: | --- |" }
                              print header
                              print rule
                          }
                          {
                              path = cell($1)
                              if (link && server != "" && repository != "" && sha != "") {
                                  path = "[" path "](" server "/" repository "/blob/" sha "/" link_prefix $1 ")"
                              } else {
                                  path = "`" path "`"
                              }
                              row = "| " path " | " $2 " / " $3 " | " indicator($2, $3) " " pct_text($2, $3) " |"
                              if (has_fn) row = row " " $4 " / " $5 " | " indicator($4, $5) " " pct_text($4, $5) " |"
                              print row
                          }
                          END { print "" }
                      '
              }

              # awk_helpers prints the awk functions shared by the renderers.
              awk_helpers() {
                  cat <<'AWK'
              # Percent cut to one decimal, as codecov.yml (precision 1, round down).
              function pct(hit, total) { return total > 0 ? int(1000 * hit / total) / 10 : 0 }
              function pct_text(hit, total) { return total > 0 ? sprintf("%.1f%%", pct(hit, total)) : "n/a" }
              function indicator(hit, total,    p) {
                  if (total <= 0) return "⚪"
                  p = pct(hit, total)
                  return p >= 80 ? "🟢" : p >= 60 ? "🟡" : "🔴"
              }
              # Ten-cell bar; a cell is filled per full 10%.
              function bar(hit, total,    filled, s, i) {
                  filled = total > 0 ? int(10 * hit / total) : 0
                  s = ""
                  for (i = 1; i <= 10; i++) s = s (i <= filled ? "█" : "░")
                  return s
              }
              # Keeps a path inside one table cell and out of markdown syntax.
              function cell(text) {
                  gsub(/&/, "\\&amp;", text); gsub(/</, "\\&lt;", text); gsub(/>/, "\\&gt;", text)
                  gsub(/\|/, "\\|", text); gsub(/`/, "\\&#96;", text)
                  return text
              }
              AWK
              }

              # unit_name and unit_title name what the line counts measure: Go counts statements, lcov lines.
              unit_name() {
                  if [[ "$COVERAGE_FORMAT" == "go" ]]; then echo "statements"; else echo "lines"; fi
              }

              unit_title() {
                  if [[ "$COVERAGE_FORMAT" == "go" ]]; then echo "Statements"; else echo "Lines"; fi
              }

              main "$@"
