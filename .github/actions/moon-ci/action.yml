name: Affected moon tasks of one project
description: >-
    Runs 'moon ci' for the runInCI tasks of one moon project that are affected since the base
    commit, plus the tasks they depend on. Passes when no task of the project is affected. Expects
    a full-history checkout and moon on PATH.

inputs:
    project:
        description: moon project ID whose tasks to run, e.g. 'hump'.
        required: true

runs:
    using: composite
    steps:
        # Reports and annotations go to .ci/ for the later job steps, since moon prefixes task
        # output. ci-* tasks may fail and are checked later. A pull request compares against its
        # base branch; a push against 'before', or HEAD^ when that commit is unknown.
        - name: Run the affected moon tasks of the project
          shell: bash
          env:
              PROJECT_ID: ${{ inputs.project }}
              EVENT_NAME: ${{ github.event_name }}
              BASE_REF: ${{ github.base_ref }}
              BEFORE_SHA: ${{ github.event.before }}
          run: |
              set -euo pipefail
              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                  base="origin/${BASE_REF}"
              elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                  base="$BEFORE_SHA"
              else
                  base="HEAD^"
              fi
              echo "Comparing against ${base}"
              # '<project>:*' limits the run to that project's tasks; moon ci still skips the
              # unaffected ones and exits 0 when none is affected.
              if ! moon ci "${PROJECT_ID}:*" --base "$base" --summary minimal; then
                  echo "::error title=${PROJECT_ID} checks failed::One or more ${PROJECT_ID} moon tasks failed; see the annotations and the task output in this step's log. Reproduce locally with: moon run root:check (a CI-only task with: CI=true moon run ${PROJECT_ID}:<task>)"
                  exit 1
              fi
