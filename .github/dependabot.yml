# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7

    - package-ecosystem: "gomod"
      directory: "/tools/actionlint"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7

    - package-ecosystem: "bun"
      directory: "/web/webui"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7

    - package-ecosystem: "docker-compose"
      directory: "/dev"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
