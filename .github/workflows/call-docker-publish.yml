name: "Docker: publish image"

# Reusable, called by release-docker-publish.yml for v* tags. Its path is the Sigstore signer
# identity (hump-cdc/hump/.github/workflows/call-docker-publish.yml@refs/tags/v*, SLSA Build L3);
# DOCKERHUB_TOKEN comes from the production environment, not the caller.
on:
    workflow_call:
        outputs:
            digest:
                description: Digest of the pushed multi-arch image index (sha256:...), for the rescan in release-docker-publish.yml
                value: ${{ jobs.publish.outputs.digest }}

permissions: {}

defaults:
    run:
        shell: bash

# No cache anywhere (no cache-from/cache-to): the image is built only from the checked-out commit.
jobs:
    # Production environment: v* tags only, reviewer approval, DOCKERHUB_TOKEN. No moon or
    # repository scripts.
    publish:
        name: Build, push, sign and attest
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        environment: production
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        permissions:
            contents: read # checkout
            id-token: write # keyless cosign signature and attestations (Sigstore OIDC)
            attestations: write # store the attestations in the GitHub attestations API
        env:
            IMAGE: docker.io/humpcdc/hump
        steps:
            # Audit mode logs outbound connections; switch to block once the audit runs show this
            # job's endpoints.
            - name: Audit outbound network traffic of the runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The Docker build has no .git, so the ldflags of the hump:build task cannot read the
            # commit there.
            - name: Compute the version, commit and build date of the image
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  {
                      echo "version=${TAG#v}"
                      echo "commit=${GITHUB_SHA::7}"
                      echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
                  } >> "$GITHUB_OUTPUT"

            # The Dockerfile uses FROM --platform=$BUILDPLATFORM and cross-compiles, so no QEMU.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  cache-binary: false

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Pre-releases get only the full version tag (no major, major.minor or latest), and v0.x
            # gets no major tag. The annotation levels also annotate the index.
            - name: Compute the image tags, labels and annotations
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              env:
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

            - name: Build and push the multi-arch image with SBOM and provenance
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: apps/hump/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  provenance: mode=max
                  sbom: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT=${{ steps.version.outputs.commit }}
                      DATE=${{ steps.version.outputs.date }}

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: "v3.1.3"

            # Keyless signature of the index digest, which covers every platform.
            - name: Sign the image with a keyless cosign signature
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: cosign sign --yes "${IMAGE}@${DIGEST}"

            # actions/attest wants 'docker.io' in a Docker Hub subject name; no storage record,
            # which needs the artifact-metadata scope.
            - name: Attest the build provenance of the image
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true
                  create-storage-record: false

            # SBOM from linux/amd64: arm64 has the same Go modules and base image packages.
            - name: Extract the SPDX SBOM of the linux/amd64 image
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
                      --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > sbom.spdx.json
                  if ! jq -e '.spdxVersion' sbom.spdx.json >/dev/null 2>&1; then
                      echo "::error file=apps/hump/Dockerfile,title=Image has no linux/amd64 SPDX SBOM::The pushed image ${IMAGE}@${DIGEST} has no SPDX SBOM for linux/amd64. Check that the build step still sets 'sbom: true' and builds linux/amd64; inspect it with: docker buildx imagetools inspect ${IMAGE}@${DIGEST} --format '{{ json .SBOM }}'"
                      exit 1
                  fi

            - name: Attest the SBOM of the image
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  sbom-path: sbom.spdx.json
                  push-to-registry: true
                  create-storage-record: false
