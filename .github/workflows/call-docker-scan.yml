name: "Docker: build and scan"

# Reusable: builds both platforms without pushing and scans them with Trivy, for PRs
# (ci-docker-scan.yml) and releases (release-docker-publish.yml). No environment and no secrets, so
# a compromised scanner can't reach release credentials.
on:
    workflow_call:

permissions: {}

defaults:
    run:
        shell: bash

# No cache anywhere (no cache-from/cache-to, no trivy cache): the image is built only from the
# checked-out commit.
jobs:
    # One job for both platforms gives the caller a single check. Trivy reads docker-archive
    # tarballs, so arm64 needs neither QEMU nor the Docker daemon.
    build-and-scan:
        name: Build and scan
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            # Endpoints come from this job's audit runs; GitHub Actions and StepSecurity endpoints
            # are allowed implicitly, telemetry is disabled instead. On a blocked connection, add
            # the endpoint from the insights link in the log.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      auth.docker.io:443
                      registry-1.docker.io:443
                      production.cloudfront.docker.com:443
                      mirror.gcr.io:443
                      get.trivy.dev:443
                      proxy.golang.org:443
                      registry.npmjs.org:443
                      release-assets.githubusercontent.com:443
                      storage.googleapis.com:443

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Same values as call-docker-publish.yml, so a release scans the published binary;
            # non-tag builds use 0.0.0. The Docker build has no .git, so the ldflags of the
            # hump:build task can't read the commit there.
            - name: Compute the version, commit and build date of the image
              id: version
              env:
                  REF: ${{ github.ref }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  version="0.0.0"
                  if [[ "$REF" == refs/tags/v* ]]; then
                      version="${TAG#v}"
                  fi
                  {
                      echo "version=${version}"
                      echo "commit=${GITHUB_SHA::7}"
                      echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
                  } >> "$GITHUB_OUTPUT"

            # The Dockerfile uses FROM --platform=$BUILDPLATFORM and cross-compiles, so no QEMU.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  cache-binary: false

            # The arm64 build reuses the build-platform stages from this builder.
            - name: Build the linux/amd64 image into a tarball
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: apps/hump/Dockerfile
                  platforms: linux/amd64
                  outputs: type=docker,name=hump:scan-linux-amd64,dest=${{ runner.temp }}/hump-linux-amd64.tar
                  provenance: false
                  sbom: false
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT=${{ steps.version.outputs.commit }}
                      DATE=${{ steps.version.outputs.date }}

            - name: Build the linux/arm64 image into a tarball
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: apps/hump/Dockerfile
                  platforms: linux/arm64
                  outputs: type=docker,name=hump:scan-linux-arm64,dest=${{ runner.temp }}/hump-linux-arm64.tar
                  provenance: false
                  sbom: false
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT=${{ steps.version.outputs.commit }}
                      DATE=${{ steps.version.outputs.date }}

            # v0.36.0 was released after the March 2026 compromise (CVE-2026-33634); its signed tag
            # points to master. exit-code 0 lets the upload run, limit-severities-for-sarif keeps
            # the severity filter in SARIF, cache: false disables the DB cache. Trivy skips
            # check.trivy.dev only with both its version check and telemetry disabled; the action
            # has no input for them, so they are set as env.
            - name: Scan the linux/amd64 image for fixable CRITICAL and HIGH vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: "v0.76.0"
                  cache: false
                  scan-type: image
                  input: ${{ runner.temp }}/hump-linux-amd64.tar
                  scanners: vuln
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  limit-severities-for-sarif: true
                  format: sarif
                  output: trivy-linux-amd64.sarif
                  exit-code: "0"
              env:
                  TRIVY_SKIP_VERSION_CHECK: "true"
                  TRIVY_DISABLE_TELEMETRY: "true"

            - name: Scan the linux/arm64 image for fixable CRITICAL and HIGH vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: "v0.76.0"
                  cache: false
                  scan-type: image
                  input: ${{ runner.temp }}/hump-linux-arm64.tar
                  scanners: vuln
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  limit-severities-for-sarif: true
                  format: sarif
                  output: trivy-linux-arm64.sarif
                  exit-code: "0"
              env:
                  TRIVY_SKIP_VERSION_CHECK: "true"
                  TRIVY_DISABLE_TELEMETRY: "true"

            # Runs on findings too, one category per platform so uploads don't replace each other.
            # Fork and Dependabot PRs (by github.actor) get a read-only token, so the upload is
            # skipped and the check step reports findings.
            - name: Upload linux/amd64 image vulnerability findings to the Security tab
              if: ${{ !cancelled() && hashFiles('trivy-linux-amd64.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: trivy-linux-amd64.sarif
                  category: trivy-linux-amd64

            - name: Upload linux/arm64 image vulnerability findings to the Security tab
              if: ${{ !cancelled() && hashFiles('trivy-linux-arm64.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: trivy-linux-arm64.sarif
                  category: trivy-linux-arm64

            - name: Check that the images have no fixable CRITICAL or HIGH vulnerabilities
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  reproduce="Reproduce locally: docker buildx build --platform <platform> -f apps/hump/Dockerfile -t hump:scan --load . && trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed hump:scan"
                  status=0
                  for platform in linux-amd64 linux-arm64; do
                      sarif="trivy-${platform}.sarif"
                      if ! jq -e '.runs' "$sarif" >/dev/null 2>&1; then
                          echo "::error file=apps/hump/Dockerfile,title=Image vulnerability scan of ${platform/-//} did not complete::Trivy wrote no valid ${sarif}; see the log of the build and scan steps for ${platform/-//} for the cause. ${reproduce}"
                          status=1
                          continue
                      fi
                      count=$(jq '[.runs[].results[]?] | length' "$sarif")
                      if (( count > 0 )); then
                          echo "Findings for ${platform/-//}:"
                          jq -r '.runs[].results[]? | "  \(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri // "-")  \(.message.text | split("\n")[0])"' "$sarif"
                          echo "::error file=apps/hump/Dockerfile,title=The ${platform/-//} image has ${count} fixable CRITICAL or HIGH vulnerabilities::The findings are above and, except on fork and Dependabot PRs, in the Security tab (category trivy-${platform}). ${reproduce}. Fix: update the base image digest in apps/hump/Dockerfile or the affected Go module in apps/hump/go.mod; for a finding that does not apply, add its ID to .trivyignore with a comment (reason and review date)."
                          status=1
                      fi
                  done
                  exit "$status"
