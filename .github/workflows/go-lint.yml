name: "Go: lint"

on:
    pull_request:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    golangci-lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Also registers the Go problem matcher that turns the text output into PR annotations.
            - name: Set up Go toolchain
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false

            # git diff prints the changes tidy made to the log before the step fails.
            - name: Check that go.mod and go.sum are tidy
              run: |
                  go mod tidy
                  if ! git diff --exit-code -- go.mod go.sum; then
                      echo "::error file=go.mod,title=go.mod and go.sum are not tidy::Run 'go mod tidy' locally and commit the updated go.mod and go.sum."
                      exit 1
                  fi

            # tools/actionlint is a separate module, so the root tidy above does not cover it. Tidy runs
            # inside its directory: with -modfile from the root, the root packages would join the module
            # graph and tidy would add their dependencies to tools/actionlint/go.mod.
            # git diff prints the changes tidy made to the log before the step fails.
            - name: Check that tools/actionlint/go.mod and go.sum are tidy
              run: |
                  go -C tools/actionlint mod tidy
                  if ! git diff --exit-code -- tools/actionlint/go.mod tools/actionlint/go.sum; then
                      echo "::error file=tools/actionlint/go.mod,title=tools/actionlint/go.mod and go.sum are not tidy::Run 'go -C tools/actionlint mod tidy' locally and commit the updated tools/actionlint/go.mod and go.sum."
                      exit 1
                  fi

            # go mod tidy never removes tool directives, so a tool nobody runs any more stays in go.mod.
            # The go command runs a tool by the last element of its path, without a major version suffix;
            # a tool counts as used when taskfile.yaml or .github runs it that way. The pattern is built
            # from the tool name at run time, so the text of this step never matches a real tool.
            - name: Check that every go.mod tool directive is used
              run: |
                  set -euo pipefail
                  unused=0
                  while IFS= read -r path; do
                      base="$path"
                      if [[ "$base" =~ ^(.+)/v[0-9]+$ ]]; then
                          base="${BASH_REMATCH[1]}"
                      fi
                      name="${base##*/}"
                      pattern="go tool ${name//./\\.}([^[:alnum:]_.-]|\$)"
                      if ! grep -rqE "$pattern" taskfile.yaml .github; then
                          echo "Tool ${path} (run as '${name}') is not used in taskfile.yaml or .github."
                          echo "::error file=go.mod,title=Unused go.mod tool directive::${path} is not run by any task or workflow. Remove it locally with 'go get -tool ${path}@none' and 'go mod tidy', then commit go.mod and go.sum."
                          unused=1
                      fi
                  done < <(go mod edit -json | jq -r '.Tool[]?.Path')
                  exit "$unused"

            # The spec embeds pkg/version.Version as info.version. 'task openapi' sets it to 0.0.0
            # through ldflags; without it the generator writes "development" and the diff always fails.
            # git diff prints the changes the generator made to the log before the step fails.
            - name: Check that the web UI OpenAPI spec is up to date
              env:
                  OPENAPI_OUT: web/webui/src/shared/api/openapi.json
              run: |
                  go run -ldflags "-X hump/pkg/version.Version=0.0.0" ./cmd/openapi
                  if ! git diff --exit-code -- "$OPENAPI_OUT"; then
                      echo "::error file=${OPENAPI_OUT},title=Web UI OpenAPI spec is out of date::Run 'task openapi' locally and commit the updated ${OPENAPI_OUT}."
                      exit 1
                  fi

            # The golangci-lint version comes from the golangci-lint/v2 requirement in go.mod.
            # A SARIF output replaces the default text output, so the text output is kept explicitly.
            - name: Lint Go code against .golangci.yml
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  args: >-
                      --output.text.path=stdout
                      --output.sarif.path=${{ runner.temp }}/golangci-lint.sarif

            # The self-repository form ($/...) is not supported by actionlint v1.7.12 yet.
            - name: Summarize Go lint findings in the job summary
              if: ${{ !cancelled() }}
              uses: ./.github/actions/sarif-summary # zizmor: ignore[self-repository]
              with:
                  sarif-file: ${{ runner.temp }}/golangci-lint.sarif
                  title: Go code lint

            # The binary is installed rather than started with go run, which turns every non-zero
            # exit into 1 and would hide exit code 3 (the code calls a vulnerable symbol).
            # The SARIF run always exits 0 and only feeds the job summary; the text run fails the
            # step and prints the call traces. Dependabot does not bump GOVULNCHECK_VERSION.
            - name: Scan Go code and dependencies for known vulnerabilities
              if: ${{ !cancelled() }}
              env:
                  GOVULNCHECK_VERSION: v1.9.0
              run: |
                  set -euo pipefail
                  package="golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
                  GOBIN="${RUNNER_TEMP}/bin" go install "$package"
                  govulncheck="${RUNNER_TEMP}/bin/govulncheck"
                  "$govulncheck" -format sarif ./... >"${RUNNER_TEMP}/govulncheck.sarif"
                  status=0
                  "$govulncheck" ./... || status=$?
                  if [[ "$status" -eq 3 ]]; then
                      echo "::error file=go.mod,title=Code calls known vulnerabilities::Upgrade the modules or the Go version in go.mod to the 'Fixed in' versions from the log (go get <module>@<version> or go mod edit -go=<version>, then go mod tidy) and commit go.mod and go.sum. Reproduce locally with: go run ${package} ./..."
                      exit 1
                  elif [[ "$status" -ne 0 ]]; then
                      echo "::error title=Vulnerability scan did not complete::govulncheck exited with status ${status}; see the log above for the cause."
                      exit 1
                  fi

            - name: Summarize Go vulnerability findings in the job summary
              if: ${{ !cancelled() }}
              uses: ./.github/actions/sarif-summary # zizmor: ignore[self-repository]
              with:
                  sarif-file: ${{ runner.temp }}/govulncheck.sarif
                  title: Go vulnerability scan
