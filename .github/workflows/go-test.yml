name: "Go: test"

on:
    pull_request:
    push:
        branches:
            - main

permissions: {}

# Runs on main are not cancelled: Codecov compares every PR against the coverage uploaded for its
# base commit on main, and a cancelled run leaves that commit without a report.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    test:
        name: Build and test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read # checkout
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Also registers the Go problem matcher that turns compiler errors into PR annotations.
            - name: Set up Go toolchain
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false

            # CGO_ENABLED=0 matches the released binary (taskfile.yaml), so an accidental cgo
            # dependency fails here. The embedded web UI build is committed, so no bun is needed.
            - name: Build all Go packages
              env:
                  CGO_ENABLED: "0"
              run: |
                  set -euo pipefail
                  if ! go build ./...; then
                      echo "::error title=Go build failed::Fix the compiler errors shown above, then check locally with: CGO_ENABLED=0 go build ./..."
                      exit 1
                  fi

            # Integration tests carry the 'integration' build tag and are left out because -tags is
            # not passed. -race needs cgo (the race runtime links against libc), so this step enables
            # it; the runner image ships gcc. -coverpkg=./... counts lines a test in one package
            # covers in another, the same as 'task test:cover'.
            - name: Run unit tests with the race detector and coverage
              env:
                  CGO_ENABLED: "1"
              run: |
                  set -euo pipefail
                  if ! go tool gotestsum \
                      --format github-actions \
                      --junitfile "${RUNNER_TEMP}/junit.xml" \
                      -- \
                      -race \
                      -covermode=atomic \
                      -coverpkg=./... \
                      -coverprofile="${RUNNER_TEMP}/cover.out" \
                      ./...; then
                      echo "::error title=Unit tests failed::Fix the failing tests or data races listed above, then check locally with: CGO_ENABLED=1 go tool gotestsum -- -race ./..."
                      exit 1
                  fi

            # cmd/openapi only writes the OpenAPI spec at build time, so it is dropped from the
            # profile; codecov.yml ignores the same path. The filtered profile feeds both the job
            # summary and Codecov, so the two count the same code.
            - name: Remove cmd/openapi from the coverage profile
              run: |
                  set -euo pipefail
                  grep -v '^hump/cmd/openapi/' "${RUNNER_TEMP}/cover.out" >"${RUNNER_TEMP}/coverage.out"

            # Counts every block of the profile once (-coverpkg repeats it per test binary), so
            # the total is covered / total statements, not an average of percentages. It can differ
            # by a tenth from 'go tool cover -func', which skips closures in package-level variables.
            # The self-repository form ($/...) is not supported by actionlint v1.7.12 yet.
            - name: Summarize code coverage by package and file in the job summary
              uses: ./.github/actions/coverage-summary # zizmor: ignore[self-repository]
              with:
                  format: go
                  coverage-file: ${{ runner.temp }}/coverage.out
                  title: Go unit test coverage
                  strip-prefix: hump/
                  excluded: cmd/openapi

            # Fork PRs and Dependabot PRs get no CODECOV_TOKEN: the upload then goes tokenless and
            # Codecov may reject it, so it fails the job only when the token is present.
            # Dependabot does not bump the Codecov CLI version input.
            - name: Upload code coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  version: v11.3.1
                  files: ${{ runner.temp }}/coverage.out
                  disable_search: true
                  flags: go
                  fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

            # Feeds Codecov Test Analytics (flaky and failed tests in the PR comment), so it also
            # runs when the tests fail.
            - name: Upload unit test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  version: v11.3.1
                  report_type: test_results
                  files: ${{ runner.temp }}/junit.xml
                  disable_search: true
                  flags: go
                  fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
