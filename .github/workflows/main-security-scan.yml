name: "Repository: security scan"

on:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    # The main ruleset's code_scanning rule matches tool 'zizmor'; the action's fixed category
    # doesn't depend on workflow or job names.
    zizmor:
        name: Security report
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            # Endpoints come from this job's audit runs; GitHub Actions and StepSecurity endpoints
            # are allowed implicitly, telemetry is disabled instead. On a blocked connection, add
            # the endpoint from the insights link in the log.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      pypi.org:443
                      files.pythonhosted.org:443

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No 'version' input: the default 'latest' is the zizmor version the pinned action
            # locks, so it follows the action SHA.
            - name: Scan workflows and upload findings to the Security tab
              uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
              with:
                  advanced-security: true

    # Weekly runs also catch vulnerabilities published without a repository change.
    govulncheck:
        name: Go vulnerability report
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        # harden-runner blocks proto's connectivity probes (google.com, clients3.google.com,
        # detectportal.firefox.com); "0" skips them so proto still installs the tools. Don't allow
        # those hosts.
        env:
            PROTO_OFFLINE: "0"
        steps:
            # Endpoints come from this job's audit runs; GitHub Actions and StepSecurity endpoints
            # are allowed implicitly, telemetry is disabled instead. On a blocked connection, add
            # the endpoint from the insights link in the log.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      ghcr.io:443
                      pkg-containers.githubusercontent.com:443
                      raw.githubusercontent.com:443
                      release-assets.githubusercontent.com:443
                      dl.google.com:443
                      proxy.golang.org:443
                      storage.googleapis.com:443
                      vuln.go.dev:443

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Same inputs as in ci-check.yml; Go comes from .moon/toolchains.yml.
            - name: Set up proto, moon, Go and Bun
              id: setup
              uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
              with:
                  auto-install: true
                  auto-setup: true
                  cache: false

            - name: Scan apps/hump for known Go vulnerabilities
              id: scan
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: |
                  set -euo pipefail
                  if ! mkdir -p .ci/hump; then
                      echo "::error file=.github/workflows/main-security-scan.yml,title=Go report directory unavailable::Check runner disk space and permissions, then rerun the job to create .ci/hump."
                      exit 1
                  fi
                  status=0
                  moon --cache off --quiet --log off run hump:vulncheck --output-style stream -- -json > .ci/hump/govulncheck.json || status=$?
                  echo "status=$status" >> "$GITHUB_OUTPUT"
                  if [[ "$status" -ne 0 ]]; then
                      echo "::error file=apps/hump/go.mod,title=Go vulnerability scan failed::Resolve the scan error above and reproduce with 'moon run hump:vulncheck'."
                      exit "$status"
                  fi

            - name: Render and validate Go vulnerability results
              if: ${{ !cancelled() && steps.scan.outputs.status != '' }}
              uses: ./.github/actions/govulncheck-summary # zizmor: ignore[self-repository]
              with:
                  file: .ci/hump/govulncheck.json
                  status: ${{ steps.scan.outputs.status }}
                  sarif: .ci/hump/govulncheck.sarif

            # Runs also when the scan found vulnerabilities, so the Security tab shows them.
            - name: Upload Go vulnerability findings to the Security tab
              if: ${{ !cancelled() && hashFiles('.ci/hump/govulncheck.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  sarif_file: .ci/hump/govulncheck.sarif
                  category: govulncheck

            - name: Upload Go vulnerability machine reports
              if: ${{ !cancelled() && hashFiles('.ci/hump/govulncheck.*') != '' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: security-go-vulnerability-reports
                  path: .ci/hump/govulncheck.*
                  include-hidden-files: true
                  if-no-files-found: error

    # bun audit covers direct and transitive packages of bun.lock (Dependabot alerts only direct
    # ones). Findings are rendered in the log and job summary; JSON is retained as an artifact.
    npm-audit:
        name: npm vulnerability report
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read # checkout
        # harden-runner blocks proto's connectivity probes (google.com, clients3.google.com,
        # detectportal.firefox.com); "0" skips them so proto still installs the tools. Don't allow
        # those hosts.
        env:
            PROTO_OFFLINE: "0"
        steps:
            # Endpoints come from this job's audit runs; GitHub Actions and StepSecurity endpoints
            # are allowed implicitly, telemetry is disabled instead. On a blocked connection, add
            # the endpoint from the insights link in the log.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      ghcr.io:443
                      pkg-containers.githubusercontent.com:443
                      raw.githubusercontent.com:443
                      release-assets.githubusercontent.com:443
                      dl.google.com:443
                      registry.npmjs.org:443

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Same inputs as in ci-check.yml; Bun comes from .moon/toolchains.yml.
            - name: Set up proto, moon, Go and Bun
              id: setup
              uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
              with:
                  auto-install: true
                  auto-setup: true
                  cache: false

            - name: Check npm dependency registry policy
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: |
                  set -euo pipefail
                  if ! moon --cache off run hump-tower:registry-check; then
                      echo "::error file=bun.lock,title=npm registry policy check failed::Remove npm registry overrides and replace non-registry.npmjs.org dependencies listed above, then run 'bun install' and 'moon run hump-tower:registry-check' and commit the manifests and lockfile."
                      exit 1
                  fi

            - name: Scan the npm dependencies in bun.lock for known vulnerabilities
              id: audit
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: |
                  set -euo pipefail
                  if ! mkdir -p .ci/hump-tower; then
                      echo "::error file=.github/workflows/main-security-scan.yml,title=npm report directory unavailable::Check runner disk space and permissions, then rerun the job to create .ci/hump-tower."
                      exit 1
                  fi
                  ignores=(
                      # happy-dom (dev, via @happy-dom/global-registrator, test DOM only): fixed in 21.0.4, published
                      # 2026-10-20; also a major upgrade from 20.14.6. Revisit on 2026-10-28.
                      --ignore=GHSA-834v-8h66-3h79
                      # fast-uri (dev, via ajv): fixed in 3.1.9, published 2026-10-19; 3.1.8 (root package.json
                      # overrides) fixes the rest. Revisit on 2026-10-27.
                      --ignore=GHSA-w74x-v6f9-j3xg
                      --ignore=GHSA-xhq7-xmqj-769h
                      --ignore=GHSA-wjr9-j795-jxcr
                      --ignore=GHSA-333x-w4r6-6crp
                  )
                  status=0
                  moon --cache off --quiet --log off run hump-tower:audit --output-style stream -- --json "${ignores[@]}" > .ci/hump-tower/audit.json || status=$?
                  echo "status=$status" >> "$GITHUB_OUTPUT"
                  if [[ "$status" -ne 0 ]]; then
                      echo "::error file=bun.lock,title=npm audit failed::Review the detailed audit report in the following step; upgrade affected packages to fixed versions at least 7 days old, run 'bun install' and commit manifests and bun.lock. Reproduce with 'moon run hump-tower:audit'."
                      exit "$status"
                  fi

            - name: Render and validate npm vulnerability results
              if: ${{ !cancelled() && steps.audit.outputs.status != '' }}
              uses: ./.github/actions/npm-audit-summary # zizmor: ignore[self-repository]
              with:
                  file: .ci/hump-tower/audit.json
                  status: ${{ steps.audit.outputs.status }}
                  ignores: >-
                      GHSA-834v-8h66-3h79 GHSA-w74x-v6f9-j3xg GHSA-xhq7-xmqj-769h
                      GHSA-wjr9-j795-jxcr GHSA-333x-w4r6-6crp

            - name: Upload npm vulnerability machine report
              if: ${{ !cancelled() && hashFiles('.ci/hump-tower/audit.json') != '' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: security-npm-vulnerability-report
                  path: .ci/hump-tower/audit.json
                  include-hidden-files: true
                  if-no-files-found: error

    # Rescans the latest release image on every run so newly published vulnerabilities show up;
    # without a stable release the job ends with a notice.
    published-image:
        name: Published image
        uses: ./.github/workflows/call-docker-scan-published.yml # zizmor: ignore[self-repository]
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
