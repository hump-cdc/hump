name: "Workflows: lint"

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Workflow syntax (actionlint) runs as root:actionlint in .github/workflows/ci-check.yml.
jobs:
    zizmor:
        name: Security
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            # Endpoints come from this job's audit runs; GitHub Actions and StepSecurity endpoints
            # are allowed implicitly. On a blocked connection, add the endpoint from the insights
            # link in the log.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      pypi.org:443
                      files.pythonhosted.org:443

            # Checks out the PR head commit, not the test merge commit: GitHub regenerates the merge
            # commit with a new SHA, and the ruleset then waits for zizmor results that never come.
            # upload-sarif in zizmor-action takes the commit from 'git rev-parse HEAD' and, when
            # HEAD isn't GITHUB_SHA, rewrites refs/pull/N/merge to refs/pull/N/head; the ruleset
            # accepts results for the head commit.
            - name: Check out the pull request head commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            # The main ruleset needs zizmor SARIF (category 'zizmor') on each PR head commit and
            # blocks on error-level or high alerts; fork PRs can't upload, so there zizmor runs
            # without SARIF and fails on findings. No 'version' input: the default follows the
            # action SHA.
            - name: Scan workflows for security issues
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
