name: "Docker: publish"

# Runs only for a published GitHub release: Scan -> Publish -> Rescan. Every job also requires a
# v* tag: the production environment accepts only v* tags, and the image tags come from the
# release tag.
on:
    release:
        types:
            - published

permissions: {}

# A release that is already publishing is never cancelled: a half-pushed image would lose its
# signature and attestations.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# Every job calls a reusable workflow of this repository at the release tag; the self-repository
# form ($/...) is not supported by actionlint v1.7.12 yet. A caller's permissions are the ceiling
# for the called workflow, so each job grants what its called job needs.
jobs:
    # Builds linux/amd64 and linux/arm64 locally and scans them before anything is pushed, the
    # same way docker-scan.yml scans every PR. No environment and no secrets.
    scan:
        name: Scan
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/scan-image.yml # zizmor: ignore[self-repository]
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning

    # Pushes the multi-arch image, signs it and attests it in the production environment (only v*
    # tags, a reviewer's approval, DOCKERHUB_TOKEN). The work is in publish-image.yml, so the
    # Sigstore identity of the signature and the attestations is that file (SLSA Build L3).
    publish:
        name: Publish
        needs: scan
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/publish-image.yml # zizmor: ignore[self-repository]
        permissions:
            contents: read # checkout
            id-token: write # keyless cosign signature and attestations (Sigstore OIDC)
            attestations: write # store the attestations in the GitHub attestations API

    # Scans the pushed image from Docker Hub by the digest Publish outputs, so the Security tab
    # shows what users actually pull. security-scan.yml rescans the latest release weekly with
    # the same workflow. No environment and no secrets.
    rescan:
        name: Rescan
        needs: publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/scan-published-image.yml # zizmor: ignore[self-repository]
        with:
            digest: ${{ needs.publish.outputs.digest }}
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
