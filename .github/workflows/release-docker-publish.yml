name: "Docker: publish"

# Published releases only: Scan -> Publish -> Rescan. Every job requires a v* tag, which the
# production environment and the image tags depend on.
on:
    release:
        types:
            - published

permissions: {}

# Never cancelled: a half-pushed image would lose its signature and attestations.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# Reusable workflows are called by local path ($/... is unsupported by actionlint v1.7.12). Caller
# permissions cap the called workflow, so each job grants what it needs.
jobs:
    # Builds and scans both platforms before anything is pushed, as ci-docker-scan.yml does for PRs.
    # No environment and no secrets.
    scan:
        name: Scan
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/call-docker-scan.yml # zizmor: ignore[self-repository]
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning

    # Runs in the production environment (v* tags, reviewer approval, DOCKERHUB_TOKEN). The Sigstore
    # signer identity is call-docker-publish.yml (SLSA Build L3). DOCKERHUB_TOKEN stays a production
    # environment secret, but without secrets: inherit the called workflow gets an empty secrets
    # context, even inside its environment job. Passing it by name is not possible: this caller job
    # has no environment, so secrets.DOCKERHUB_TOKEN is empty here (hence the secrets-inherit ignore).
    publish:
        name: Publish
        needs: scan
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/call-docker-publish.yml # zizmor: ignore[self-repository,secrets-inherit]
        secrets: inherit
        permissions:
            contents: read # checkout
            id-token: write # keyless cosign signature and attestations (Sigstore OIDC)
            attestations: write # store the attestations in the GitHub attestations API

    # Scans the pushed digest from Docker Hub; main-security-scan.yml rescans the latest release
    # weekly. No environment and no secrets.
    rescan:
        name: Rescan
        needs: publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/workflows/call-docker-scan-published.yml # zizmor: ignore[self-repository]
        with:
            digest: ${{ needs.publish.outputs.digest }}
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
