name: "Docker: build and scan"

# Reusable: builds the image for linux/amd64 and linux/arm64 without pushing it and scans each
# platform with Trivy. Called by docker-scan.yml (every PR and push to main) and by publish.yml
# (before a release is pushed), so a PR and a release are scanned the same way.
# The job has no environment and no secrets, so a compromised scanner action cannot reach the
# release credentials. The base images are pulled anonymously.
on:
    workflow_call:

permissions: {}

defaults:
    run:
        shell: bash

# No cache anywhere (no cache-from/cache-to, no trivy cache): the image is built only from the
# checked-out commit, so nothing written by another workflow run can end up in it.
jobs:
    # One job for both platforms, so the caller has a single check to require and to wait for.
    # Each platform is exported to a docker-archive tarball and Trivy reads the tarball: the
    # Docker daemon is not involved, so the arm64 image needs neither QEMU nor the containerd
    # image store on the amd64 runner.
    build-and-scan:
        name: Build and scan
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            # Audit mode only logs outbound connections; the policy switches to block once the
            # endpoints this job needs are collected from the audit runs.
            - name: Audit outbound network traffic of the runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Same values as in publish-image.yml, so for a release the scanned binary matches the
            # published one. A PR or a push to main has no version tag and builds 0.0.0 (the
            # Dockerfile default). The Docker build has no .git, so ldflags.sh cannot read the
            # commit there.
            - name: Compute the version, commit and build date of the image
              id: version
              env:
                  REF: ${{ github.ref }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  version="0.0.0"
                  if [[ "$REF" == refs/tags/v* ]]; then
                      version="${TAG#v}"
                  fi
                  {
                      echo "version=${version}"
                      echo "commit=${GITHUB_SHA::7}"
                      echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
                  } >> "$GITHUB_OUTPUT"

            # The Dockerfile uses FROM --platform=$BUILDPLATFORM and cross-compiles, so no QEMU.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  cache-binary: false

            # The UI stage and the Go module download run on the build platform, so the arm64
            # build below reuses them from this builder's state of the same run.
            - name: Build the linux/amd64 image into a tarball
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: apps/hump/Dockerfile
                  platforms: linux/amd64
                  outputs: type=docker,name=hump:scan-linux-amd64,dest=${{ runner.temp }}/hump-linux-amd64.tar
                  provenance: false
                  sbom: false
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT=${{ steps.version.outputs.commit }}
                      DATE=${{ steps.version.outputs.date }}

            - name: Build the linux/arm64 image into a tarball
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: apps/hump/Dockerfile
                  platforms: linux/arm64
                  outputs: type=docker,name=hump:scan-linux-arm64,dest=${{ runner.temp }}/hump-linux-arm64.tar
                  provenance: false
                  sbom: false
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT=${{ steps.version.outputs.commit }}
                      DATE=${{ steps.version.outputs.date }}

            # trivy-action was compromised in March 2026 (CVE-2026-33634): every tag but one was
            # rewritten. v0.36.0 was released after the incident; its signed tag points to a commit
            # on master. Exit code 0 lets the upload run; the last step fails the job.
            # limit-severities-for-sarif: without it the action drops the severity filter for SARIF
            # and the report holds every severity. scanners: vuln, because secret findings have a
            # different fix. Trivy reads .trivyignore from the repository root on its own when
            # the file exists. cache: false also turns off the action's actions/cache of the DB.
            # The second scan reuses the setup and the DB that the first one downloaded.
            - name: Scan the linux/amd64 image for fixable CRITICAL and HIGH vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: "v0.76.0"
                  cache: false
                  scan-type: image
                  input: ${{ runner.temp }}/hump-linux-amd64.tar
                  scanners: vuln
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  limit-severities-for-sarif: true
                  format: sarif
                  output: trivy-linux-amd64.sarif
                  exit-code: "0"

            - name: Scan the linux/arm64 image for fixable CRITICAL and HIGH vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: "v0.76.0"
                  cache: false
                  scan-type: image
                  input: ${{ runner.temp }}/hump-linux-arm64.tar
                  scanners: vuln
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  limit-severities-for-sarif: true
                  format: sarif
                  output: trivy-linux-arm64.sarif
                  exit-code: "0"

            # Runs also when the scan found vulnerabilities, so the Security tab shows them. One
            # category per platform: a second upload under the same category would replace the
            # first. A PR from a fork or from Dependabot gets a read-only GITHUB_TOKEN whatever the
            # job requests, so the upload is skipped there; the check step below still fails on
            # findings and prints them to the log. github.actor (not the PR author) is what
            # GitHub uses to give a Dependabot run the read-only token.
            - name: Upload linux/amd64 image vulnerability findings to the Security tab
              if: ${{ !cancelled() && hashFiles('trivy-linux-amd64.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
              uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  sarif_file: trivy-linux-amd64.sarif
                  category: trivy-linux-amd64

            - name: Upload linux/arm64 image vulnerability findings to the Security tab
              if: ${{ !cancelled() && hashFiles('trivy-linux-arm64.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
              uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  sarif_file: trivy-linux-arm64.sarif
                  category: trivy-linux-arm64

            - name: Check that the images have no fixable CRITICAL or HIGH vulnerabilities
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  reproduce="Reproduce locally: docker buildx build --platform <platform> -f apps/hump/Dockerfile -t hump:scan --load . && trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed hump:scan"
                  status=0
                  for platform in linux-amd64 linux-arm64; do
                      sarif="trivy-${platform}.sarif"
                      if ! jq -e '.runs' "$sarif" >/dev/null 2>&1; then
                          echo "::error file=apps/hump/Dockerfile,title=Image vulnerability scan of ${platform/-//} did not complete::Trivy wrote no valid ${sarif}; see the log of the build and scan steps for ${platform/-//} for the cause. ${reproduce}"
                          status=1
                          continue
                      fi
                      count=$(jq '[.runs[].results[]?] | length' "$sarif")
                      if (( count > 0 )); then
                          echo "Findings for ${platform/-//}:"
                          jq -r '.runs[].results[]? | "  \(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri // "-")  \(.message.text | split("\n")[0])"' "$sarif"
                          echo "::error file=apps/hump/Dockerfile,title=The ${platform/-//} image has ${count} fixable CRITICAL or HIGH vulnerabilities::The findings are above and, except on fork and Dependabot PRs, in the Security tab (category trivy-${platform}). ${reproduce}. Fix: update the base image digest in apps/hump/Dockerfile or the affected Go module in apps/hump/go.mod; for a finding that does not apply, add its ID to .trivyignore with a comment (reason and review date)."
                          status=1
                      fi
                  done
                  exit "$status"
