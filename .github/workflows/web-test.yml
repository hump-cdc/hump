name: Web UI unit tests

on:
    pull_request:
    push:
        branches:
            - main

permissions: {}

# Runs on main are not cancelled: Codecov compares every PR against the coverage uploaded for its
# base commit on main, and a cancelled run leaves that commit without a report.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    test:
        name: Run web UI unit tests with coverage
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read # checkout
        defaults:
            run:
                shell: bash
                working-directory: web/webui
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The Bun version comes from packageManager in package.json. The path is relative to the
            # repository root: defaults.run.working-directory does not apply to actions.
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: web/webui/package.json
                  no-cache: true

            # web-lint.yml reports an out-of-date bun.lock with the fix; here it only stops the
            # install from resolving versions the lockfile does not pin.
            - name: Install web UI dependencies from bun.lock
              run: |
                  set -euo pipefail
                  if ! bun install --frozen-lockfile; then
                      echo "::error file=web/webui/bun.lock,title=Web UI dependencies failed to install::If bun.lock is out of date, run 'bun install' in web/webui locally and commit the updated package.json and bun.lock."
                      exit 1
                  fi

            # Coverage ignores (generated API client, test doubles) live in bunfig.toml [test], so
            # a local 'bun test --coverage' reports the same total. The console output with
            # failing tests and their diffs stays in the log alongside the JUnit report.
            - name: Run web UI unit tests with coverage
              run: |
                  set -euo pipefail
                  if ! bun test \
                      --coverage \
                      --coverage-reporter=text \
                      --coverage-reporter=lcov \
                      --coverage-dir="${RUNNER_TEMP}/coverage" \
                      --reporter=junit \
                      --reporter-outfile="${RUNNER_TEMP}/junit.xml"; then
                      echo "::error title=Web UI unit tests failed::Fix the failing tests listed above, then check locally in web/webui with: bun test"
                      exit 1
                  fi

            # Sums the per-file LF/LH (lines) and FNF/FNH (functions) records of the lcov report,
            # the same file Codecov receives, weighted by line count and cut to one decimal like
            # codecov.yml (precision 1, round down). The "All files" row of Bun's text table is an
            # unweighted per-file average, so it differs.
            - name: Summarize total code coverage in the job summary
              run: |
                  set -euo pipefail
                  read -r line_pct func_pct < <(awk -F: '
                      $1 == "LF" { lf += $2 } $1 == "LH" { lh += $2 }
                      $1 == "FNF" { fnf += $2 } $1 == "FNH" { fnh += $2 }
                      function pct(hit, found) { return found ? int(1000 * hit / found) / 10 : 0 }
                      END { printf "%.1f%% %.1f%%\n", pct(lh, lf), pct(fnh, fnf) }
                  ' "${RUNNER_TEMP}/coverage/lcov.info")
                  {
                      echo "## Web UI unit test coverage"
                      echo
                      echo "Total line coverage: **${line_pct}**, function coverage: **${func_pct}**"
                  } >>"$GITHUB_STEP_SUMMARY"

            # Bun writes paths relative to web/webui; the 'fixes' entry in codecov.yml maps them to
            # repository paths. Fork PRs and Dependabot PRs get no CODECOV_TOKEN: the upload then
            # goes tokenless and Codecov may reject it, so it fails the job only when the token is
            # present. Dependabot does not bump the Codecov CLI version input.
            - name: Upload code coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  version: v11.3.1
                  files: ${{ runner.temp }}/coverage/lcov.info
                  disable_search: true
                  flags: webui
                  fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

            # Feeds Codecov Test Analytics (flaky and failed tests in the PR comment), so it also
            # runs when the tests fail.
            - name: Upload unit test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  version: v11.3.1
                  report_type: test_results
                  files: ${{ runner.temp }}/junit.xml
                  disable_search: true
                  flags: webui
                  fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
