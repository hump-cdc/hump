name: GitHub Actions workflows security report

on:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    zizmor:
        name: Report GitHub Actions workflow security issues to code scanning
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Scan workflows and upload findings to the Security tab
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: true
                  version: "1.31.1"
