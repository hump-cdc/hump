name: "Workflows: lint"

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Workflow syntax (actionlint) runs as root:actionlint in .github/workflows/check.yml.
jobs:
    zizmor:
        name: Security
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout
        steps:
            # Audit mode only logs outbound connections; the policy switches to block once the
            # endpoints this job needs are collected from the audit runs.
            - name: Audit outbound network traffic of the runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Scan workflows for security issues
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: false
                  version: "1.31.1"
