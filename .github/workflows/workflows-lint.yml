name: "Workflows: lint"

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Workflow syntax (actionlint) runs as root:actionlint in .github/workflows/check.yml.
jobs:
    zizmor:
        name: Security
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read # checkout
            security-events: write # upload SARIF to code scanning
        steps:
            # Block mode: only the endpoints below are reachable. They were collected from the
            # audit runs of this job (StepSecurity insights). The agent also allows GitHub's
            # Actions service endpoints (*.actions.githubusercontent.com, codeload.github.com, the
            # results storage, the cache host) and its own StepSecurity API implicitly
            # (addImplicitEndpoints in step-security/agent). When a step fails on a blocked
            # connection, open the insights link this step prints in the log and add the
            # endpoint here.
            - name: Restrict outbound network traffic of the runner to the allowed endpoints
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      pypi.org:443
                      files.pythonhosted.org:443

            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The code_scanning rule of the main ruleset waits for zizmor results on the PR commit,
            # so the action uploads its SARIF (category 'zizmor', like security-scan.yml on main;
            # analyses are kept per ref). The upload needs only api.github.com. In SARIF mode
            # zizmor exits 0 on findings: the ruleset blocks the merge on error-level or high
            # severity alerts, and the findings show as code scanning annotations on the PR. A PR
            # from a fork gets a read-only token, so the upload would fail; there the action runs
            # without SARIF and the step fails on any finding. Dependabot PRs upload: the
            # 'permissions' key above raises their read-only token.
            #
            # No 'version' input: the default 'latest' is the zizmor version that the pinned action
            # locks with hashes in its own tree (support/locks), so Dependabot bumps zizmor together
            # with the action SHA.
            - name: Scan workflows for security issues
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
