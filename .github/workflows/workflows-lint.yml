name: "Workflows: lint"

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    actionlint:
        name: Syntax
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go toolchain
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Lint workflow syntax, expressions and shell scripts
              run: go tool -modfile=tools/actionlint/go.mod actionlint

    zizmor:
        name: Security
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Scan workflows for security issues
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: false
                  version: "1.31.1"
