$schema: './cache/schemas/toolchains.json'

# Exact versions, each published at least 7 days before it is pinned here (AGENTS.md).
# Dependabot does not update this file or .prototools.

proto:
  version: '0.63.1'

go:
  version: '1.26.9'
  # One Go module for now; turn on when packages/ gets Go modules that import each other.
  inferRelationships: false
  # Go downloads modules on demand. Skips moon's `go work sync` / `go mod download`, which could
  # rewrite go.mod or go.work.sum behind the tidy check.
  installDependencies: false

javascript:
  packageManager: 'bun'
  inferTasksFromScripts: false
  syncProjectWorkspaceDependencies: false
  dedupeOnLockfileChange: false

bun:
  version: '1.3.11'
