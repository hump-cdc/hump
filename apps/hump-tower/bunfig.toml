[test]
# Keep the coverage total about the code written here, locally and in CI
# (.github/workflows/ci-check.yml, moon task hump-tower:ci-test). Test files are skipped too
# (coverageSkipTestFiles).
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    # Generated by 'bun run generate:openapi' from openapi.json.
    "src/shared/api/generated/**",
    # Test-only doubles, imported only by *.test.* files.
    "**/*.fake.ts",
]
