$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'frontend'
project:
  title: 'hump-tower'
  description: 'hump web UI (React, rsbuild, bun), built into apps/hump/internal/controller/hump_tower and embedded in the hump binary.'

taskOptions:
  runInCI: 'always'

tasks:
  openapi:
    description: 'Generate src/shared/api/openapi.json from the hump controllers'
    # Lives here and not in hump: hump:build depends on hump-tower:build, and a dep back into
    # hump would make moon infer a cyclic project dependency.
    # Version=0.0.0 only: the spec embeds info.version, so the output stays deterministic.
    script: 'go -C ../hump run -ldflags "-X hump/pkg/version.Version=0.0.0" ./cmd/openapi'
    toolchains: ['go']
    env:
      CGO_ENABLED: '0'
      OPENAPI_OUT: '$projectRoot/src/shared/api/openapi.json'
    inputs: ['/apps/hump/**/*.go', '/apps/hump/go.mod', '/apps/hump/go.sum']
    outputs: ['src/shared/api/openapi.json']
    options:
      runInCI: 'always'
  build:
    description: 'Build the UI into ../hump/internal/controller/hump_tower (prebuild runs openapi-ts)'
    command: 'bun run build'
    deps: ['openapi']
    env:
      NODE_ENV: 'production'
      VERSION: '0.0.0'
    inputs:
      - 'app/**/*'
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'rsbuild.config.ts'
      - 'openapi-ts.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'tsr.config.json'
      - 'package.json'
      - '/package.json'
      - '/bun.lock'
      - '/bunfig.toml'
    outputs: ['/apps/hump/internal/controller/hump_tower']
    options:
      runInCI: 'always'
  dev:
    description: 'rsbuild dev server on :3000, calling the hump API on :3200 (hump:run allows it via CORS)'
    command: 'bun run dev'
    deps: ['openapi']
    preset: 'server'
    env:
      API_URL: 'http://localhost:3200'
  storybook:
    description: 'Storybook for the UI kit on :6006'
    command: 'bun run storybook'
    preset: 'server'
  test:
    description: 'Unit tests (bun test)'
    command: 'bun test'
  test-file:
    description: 'Run one test file, passed as an arg: moon run hump-tower:test-file -- <path>'
    # command, not script: moon appends the passthrough args only to a command. A path that
    # starts with / or ./ runs that file; a bare name would be a substring filter.
    command: 'bun test'
    preset: 'utility'
  test-cover:
    description: 'Run all tests with a coverage table in the terminal'
    command: 'bun test --coverage --coverage-reporter=text'
    preset: 'utility'
  test-file-cover:
    description: 'Run one test file with a coverage table: moon run hump-tower:test-file-cover -- <path>'
    # Covers whatever the test imports, not only the file under test.
    command: 'bun test --coverage --coverage-reporter=text'
    preset: 'utility'
  check:
    description: 'Biome: lint, format, import order'
    command: 'bun run check'
  typecheck:
    description: 'TypeScript type check'
    command: 'bun x --no-install tsc --noEmit'
  knip:
    description: 'Unused files, exports, types and dependencies'
    command: 'bun run knip'
  audit:
    description: 'Known vulnerabilities in the npm packages of the root bun.lock (bun audit)'
    command: 'bun audit'
    # Local audit includes all advisories; Actions supplies its reviewed exceptions as flags.
    options:
      cache: false
      runInCI: 'always'
  registry-check:
    description: 'Verify npm packages and configuration use only registry.npmjs.org'
    script: |
      set -euo pipefail
      root="$MOON_WORKSPACE_ROOT"
      status=0
      # shellcheck disable=SC2016
      if ! offenders="$(bun -e '
        const lock = require(process.argv[1])
        for (const [key, [resolution, registry]] of Object.entries(lock.packages)) {
          const spec = resolution.slice(resolution.lastIndexOf("@") + 1)
          if (/^(workspace|link|file):/.test(spec)) continue
          const isNpm = /^\d/.test(spec) && typeof registry === "string"
          if (isNpm && (registry === "" || registry.startsWith("https://registry.npmjs.org/"))) continue
          console.log(`${key} -> ${resolution}${typeof registry === "string" && registry ? ` (${registry})` : ""}`)
        }
      ' "$root/bun.lock")"; then
        echo "Could not parse bun.lock. Fix the error above or regenerate it with bun install in the repository root." >&2
        exit 1
      fi
      if [[ -n "$offenders" ]]; then
        echo "Packages outside registry.npmjs.org:"
        echo "$offenders"
        echo "Replace them with versions from https://registry.npmjs.org/, run bun install in the repository root and commit package.json and bun.lock." >&2
        status=1
      fi
      shopt -s nullglob
      for file in "$root"/{,apps/*/,packages/*/}{.npmrc,bunfig.toml}; do
        [[ -f "$file" ]] || continue
        if [[ "$file" == */.npmrc ]] || grep -q -E '^[[:space:]]*(registry[[:space:]]*=|\[install\.(registry|scopes)\])' "$file"; then
          echo "Remove the registry settings (or .npmrc) from ${file#"$root"/}, so Bun resolves every package from https://registry.npmjs.org/." >&2
          status=1
        fi
      done
      exit "$status"
    inputs: ['/bun.lock', '/bunfig.toml', '/.npmrc', '/apps/*/bunfig.toml', '/apps/*/.npmrc', '/packages/*/bunfig.toml', '/packages/*/.npmrc']
    options:
      cache: false
      runInCI: 'always'
