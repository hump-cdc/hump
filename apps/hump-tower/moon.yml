$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'frontend'
project:
  title: 'hump-tower'
  description: 'hump web UI (React, rsbuild, bun), built into apps/hump/internal/controller/hump_tower and embedded in the hump binary.'

taskOptions:
  runInCI: false

tasks:
  openapi:
    description: 'Generate src/shared/api/openapi.json from the hump controllers'
    # Lives here and not in hump: hump:build depends on hump-tower:build, and a dep back into
    # hump would make moon infer a cyclic project dependency.
    # Version=0.0.0 only: the spec embeds info.version, so the output stays deterministic.
    script: 'go -C ../hump run -ldflags "-X hump/pkg/version.Version=0.0.0" ./cmd/openapi'
    toolchains: ['go']
    env:
      CGO_ENABLED: '0'
      OPENAPI_OUT: '$projectRoot/src/shared/api/openapi.json'
    inputs: ['/apps/hump/**/*.go', '/apps/hump/go.mod', '/apps/hump/go.sum']
    outputs: ['src/shared/api/openapi.json']
    options:
      runInCI: true
  build:
    description: 'Build the UI into ../hump/internal/controller/hump_tower (prebuild runs openapi-ts)'
    command: 'bun run build'
    deps: ['openapi']
    env:
      NODE_ENV: 'production'
      VERSION: '0.0.0'
    inputs:
      - 'app/**/*'
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'rsbuild.config.ts'
      - 'openapi-ts.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'tsr.config.json'
      - 'package.json'
      - '/package.json'
      - '/bun.lock'
      - '/bunfig.toml'
    outputs: ['/apps/hump/internal/controller/hump_tower']
    options:
      runInCI: true
  dev:
    description: 'rsbuild dev server on :3000, calling the hump API on :3200 (hump:run allows it via CORS)'
    command: 'bun run dev'
    deps: ['openapi']
    preset: 'server'
    env:
      API_URL: 'http://localhost:3200'
  storybook:
    description: 'Storybook for the UI kit on :6006'
    command: 'bun run storybook'
    preset: 'server'
  test:
    description: 'Unit tests (bun test)'
    command: 'bun test'
  check:
    description: 'Biome: lint, format, import order'
    command: 'bun run check'
  typecheck:
    description: 'TypeScript type check'
    command: 'bun x --no-install tsc --noEmit'
  knip:
    description: 'Unused files, exports, types and dependencies'
    command: 'bun run knip'
  ci-knip:
    description: 'CI: knip with GitHub annotations in .ci/annotations'
    script: 'bash ./scripts/ci.sh knip'
    # knip sees the freshly generated API client.
    deps: ['build']
    options:
      cache: false
      runInCI: 'only'
      # The workflow fails on .ci/failed markers instead: a failed task would abort the
      # pipeline and cancel the other checks, e.g. the tests behind a lint finding.
      allowFailure: true
  ci-biome:
    description: 'CI: biome with a SARIF report in .ci/hump-tower'
    script: 'bash ./scripts/ci.sh biome'
    options:
      cache: false
      runInCI: 'only'
      # The workflow fails on .ci/failed markers instead: a failed task would abort the
      # pipeline and cancel the other checks, e.g. the tests behind a lint finding.
      allowFailure: true
  ci-test:
    description: 'CI: tests with lcov coverage and JUnit in .ci/hump-tower'
    script: 'bash ./scripts/ci.sh test'
    options:
      cache: false
      runInCI: 'only'
      # The workflow fails on .ci/failed markers instead: a failed task would abort the
      # pipeline and cancel the other checks, e.g. the tests behind a lint finding.
      allowFailure: true
  ci-typecheck:
    description: 'CI: TypeScript type check with a fix hint in .ci/annotations'
    script: 'bash ./scripts/ci.sh typecheck'
    options:
      cache: false
      runInCI: 'only'
      # The workflow fails on .ci/failed markers instead: a failed task would abort the
      # pipeline and cancel the other checks, e.g. the tests behind a lint finding.
      allowFailure: true
