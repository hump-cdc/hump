version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - noctx
    - nilerr
    - exhaustive
    - copyloopvar
    - durationcheck
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
    - perfsprint
    - intrange
    - gosec
    - funlen
    - gocognit
    - gocyclo
    - depguard

  settings:
    funlen:
      lines: 140
      statements: 80
    gocognit:
      # Reports only functions with complexity strictly above this value.
      min-complexity: 60
    gocyclo:
      min-complexity: 30
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      # Listing any rule turns off the defaults unless this is set; the default set
      # includes `exported` and `package-comments`.
      enable-default-rules: true
      rules:
        - name: var-naming
          disabled: true
    depguard:
      # Globs match absolute file paths, hence the ${base-path} anchor.
      # Lists have no `allow`, so only `deny` applies; third-party imports are untouched.
      rules:
        domain:
          files:
            - "${base-path}/internal/domain/**"
            - "!$test"
          deny:
            - pkg: hump/
              desc: "internal/domain is the innermost layer and imports nothing from the module (AGENTS.md)"
        port:
          files:
            - "${base-path}/internal/port/**"
          deny:
            - pkg: hump/internal/adapter
              desc: "internal/port may import only internal/domain (AGENTS.md)"
            - pkg: hump/internal/application
              desc: "internal/port may import only internal/domain (AGENTS.md)"
            - pkg: hump/internal/controller
              desc: "internal/port may import only internal/domain (AGENTS.md)"
            - pkg: hump/config
              desc: "internal/port may import only internal/domain (AGENTS.md)"
            - pkg: hump/pkg
              desc: "internal/port may import only internal/domain (AGENTS.md)"
        adapter:
          files:
            - "${base-path}/internal/adapter/**"
          deny:
            - pkg: hump/internal/application
              desc: "internal/adapter may import port, domain, config and pkg only (AGENTS.md)"
            - pkg: hump/internal/controller
              desc: "internal/adapter may import port, domain, config and pkg only (AGENTS.md)"
        application:
          files:
            - "${base-path}/internal/application/**"
          deny:
            - pkg: hump/internal/adapter
              desc: "use cases depend on ports, never on adapters (AGENTS.md)"
            - pkg: hump/internal/controller
              desc: "nothing imports internal/controller except cmd/hump and cmd/openapi (AGENTS.md)"
        controller:
          files:
            - "${base-path}/internal/controller/**"
            - "!$test"
          deny:
            - pkg: hump/internal/adapter
              desc: "internal/controller may import application, port and pkg only; adapters are wired in cmd/hump (AGENTS.md)"
            - pkg: hump/internal/domain
              desc: "internal/controller may import application, port and pkg only (AGENTS.md)"
            - pkg: hump/config
              desc: "internal/controller may import application, port and pkg only (AGENTS.md)"
        pkg:
          files:
            - "${base-path}/pkg/**"
          deny:
            - pkg: hump/internal
              desc: "pkg/ is re-usable and imports nothing from internal (AGENTS.md)"
            - pkg: hump/config
              desc: "pkg/ is re-usable and imports nothing from config (AGENTS.md)"
        config:
          files:
            - "${base-path}/config/**"
          deny:
            - pkg: hump/internal/adapter
              desc: "config may import port, domain and pkg only (AGENTS.md)"
            - pkg: hump/internal/application
              desc: "config may import port, domain and pkg only (AGENTS.md)"
            - pkg: hump/internal/controller
              desc: "config may import port, domain and pkg only (AGENTS.md)"
        no-adapter-outside-cmd:
          files:
            - "$all"
            - "!${base-path}/cmd/**"
            # Adapter-to-adapter imports are the registry exception (adapter/sink -> its subpackages).
            - "!${base-path}/internal/adapter/**"
            - "!$test"
          deny:
            - pkg: hump/internal/adapter
              desc: "only the composition root (cmd/) imports internal/adapter (AGENTS.md)"

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - gosec
          - errcheck
          - noctx
          - bodyclose
          - unparam

issues:
  # Show every issue, not just the first one reported on a line.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
