$schema: '../../.moon/cache/schemas/project.json'

language: 'go'
layer: 'application'
stack: 'backend'
project:
  title: 'hump'
  description: 'PostgreSQL change data capture service (Go module `hump`); embeds the hump-tower UI.'

env:
  # Matches the released binary; test-race enables cgo for the race detector.
  CGO_ENABLED: '0'

fileGroups:
  sources: ['**/*.go', 'go.mod', 'go.sum']
  embedded: ['internal/controller/hump_tower/**/*']

taskOptions:
  # Actions explicitly invokes ordinary tasks, independently of affected-project selection.
  runInCI: 'always'

tasks:
  build:
    description: 'Check that all packages build without cgo, then build bin/hump with the embedded hump-tower UI'
    # The ldflags stamp pkg/version: VERSION (default 0.0.0), the short commit and the UTC build
    # date. run and run-cleanup repeat them.
    script: 'go build ./... && go build -ldflags "-s -w -X hump/pkg/version.Version=${VERSION:-0.0.0} -X hump/pkg/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X hump/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ./bin/hump ./cmd/hump'
    deps: ['hump-tower:build']
    inputs: ['@group(sources)', '@group(embedded)']
    outputs: ['bin/hump']
    options:
      # Stamps commit and date; in CI it also forces the UI rebuild for the embed drift check.
      cache: false
      runInCI: 'always'
  run:
    description: 'Run hump against the dev environment (start it with moon run root:dev-up)'
    script: 'exec go run -ldflags "-s -w -X hump/pkg/version.Version=${VERSION:-0.0.0} -X hump/pkg/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X hump/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/hump -f ../../dev/hump.yaml'
    deps: ['hump-tower:build']
    preset: 'server'
    options:
      runInCI: false
    # Fallbacks only: task env does not override the caller's environment.
    env:
      DATABASE_URL: 'postgres://hump:hump@localhost:5437/hump?sslmode=disable'
      TELEMETRY_PORT: '9100'
      WEB_PORT: '3200'
      LOG_VERBOSE: 'false'
      LOG_FORMAT: 'pretty'
      CORS: 'http://localhost:3000'
      KAFKA_HOST: 'localhost:9092'
      NATS_URL: 'nats://localhost:4222'
      NATS2_URL: 'nats://localhost:4223'
      RABBITMQ_URL: 'amqp://hump:hump@localhost:5672/'
      RABBITMQ_STREAM_URL: 'rabbitmq-stream://hump:hump@localhost:5552/%2F'
  run-cleanup:
    description: 'Remove hump replication artifacts from the dev database'
    script: 'exec go run -ldflags "-s -w -X hump/pkg/version.Version=${VERSION:-0.0.0} -X hump/pkg/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X hump/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/hump -f ../../dev/hump.yaml --cleanup'
    preset: 'utility'
    env:
      DATABASE_URL: 'postgres://hump:hump@localhost:5437/hump?sslmode=disable'
      LOG_VERBOSE: 'false'
      LOG_FORMAT: 'pretty'
  test:
    description: 'Run all unit tests'
    command: 'go tool gotestsum --format testdox'
    inputs: ['@group(sources)']
  test-race:
    description: 'Run all unit tests with the race detector (accepts gotestsum and Go test arguments)'
    command: 'go tool gotestsum --format testname'
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-race'
    inputs: ['@group(sources)']
    options:
      # Race is a property of this task, not an optional caller default.
      envOverride: true
  test-integration:
    description: 'Run opt-in string literal integration tests against an isolated PostgreSQL 17 with default strings off'
    script: |
      set -euo pipefail
      : "${HUMP_TEST_POSTGRES_DSN:?Set HUMP_TEST_POSTGRES_DSN to an isolated PostgreSQL 17 instance with standard_conforming_strings=off}"
      go test -tags=integration -count=1 -v -run '^TestPostgresStringLiteralsIntegration' ./internal/adapter/postgres
    preset: 'utility'
    options:
      cache: false
      runInCI: false
  test-where-fuzz:
    description: 'Fuzz the WHERE parser, literal quoting and suggestions for 10 seconds each'
    script: |
      set -euo pipefail
      for target in FuzzSnapshotWhereParser FuzzSnapshotWhereQuoting FuzzSnapshotWhereSuggester; do
        go test -run '^$' -fuzz "^${target}$" -fuzztime=10s ./internal/adapter/postgres
      done
    preset: 'utility'
    options:
      cache: false
      runInCI: false
  test-file:
    description: 'Run the tests of the package in the directory moon was started from'
    script: 'cd "$MOON_WORKING_DIR" && exec go tool gotestsum --format testdox'
    preset: 'utility'
  test-cover:
    description: 'Run all tests with -coverpkg=./... and open the HTML coverage report'
    # Writes the report to $TMPDIR/hump-cover.html and opens it; test-file-cover repeats this.
    # MSYS_NO_PATHCONV keeps Git Bash from rewriting /c into a drive path.
    script: |
      set -euo pipefail
      trap 'rm -f cover.out' EXIT
      report="${TMPDIR:-/tmp}/hump-cover.html"
      go tool gotestsum --format testdox -- -coverprofile=cover.out -coverpkg=./... ./...
      go tool gocov convert cover.out | go tool gocov-html >"$report"
      case "$(uname -s)" in
        Darwin) open "$report" ;;
        MINGW* | MSYS* | CYGWIN*) MSYS_NO_PATHCONV=1 cmd /c start "" "$(cygpath -w "$report")" ;;
        *) xdg-open "$report" ;;
      esac
    preset: 'utility'
  test-file-cover:
    description: 'Coverage report for the package in the directory moon was started from'
    script: |
      set -euo pipefail
      cd "$MOON_WORKING_DIR"
      trap 'rm -f cover.out' EXIT
      report="${TMPDIR:-/tmp}/hump-cover.html"
      go tool gotestsum --format testdox -- -coverprofile=cover.out
      go tool gocov convert cover.out | go tool gocov-html >"$report"
      case "$(uname -s)" in
        Darwin) open "$report" ;;
        MINGW* | MSYS* | CYGWIN*) MSYS_NO_PATHCONV=1 cmd /c start "" "$(cygpath -w "$report")" ;;
        *) xdg-open "$report" ;;
      esac
    preset: 'utility'
  lint:
    description: 'golangci-lint with .golangci.yml'
    command: 'go tool golangci-lint run'
    inputs: ['@group(sources)', '.golangci.yml']
  lint-fix:
    description: 'golangci-lint with automatic fixes'
    script: 'go tool golangci-lint run --fix'
    preset: 'utility'
  fmt:
    description: 'Format Go code (gofmt, goimports)'
    script: 'go tool golangci-lint fmt'
    preset: 'utility'
  tidy:
    description: 'go mod tidy for hump and for the separate actionlint and govulncheck tool modules'
    script: 'go mod tidy && GOWORK=off go -C tools/actionlint mod tidy && GOWORK=off go -C tools/govulncheck mod tidy'
    inputs: ['@group(sources)', 'tools/actionlint/go.mod', 'tools/actionlint/go.sum', 'tools/govulncheck/go.mod', 'tools/govulncheck/go.sum']
    options:
      # CI diffs the result in a later workflow step.
      cache: false
      runInCI: 'always'
  vulncheck:
    description: 'Scan Go packages for known vulnerabilities (accepts govulncheck arguments)'
    # Keep the full-package default after the forwarded flags (Go flags stop at a pattern).
    command: ['bash', '-c', 'exec go tool -modfile=tools/govulncheck/go.mod govulncheck "$@" ./...', '--']
    env:
      GOWORK: 'off'
    inputs: ['@group(sources)', 'tools/govulncheck/go.mod', 'tools/govulncheck/go.sum']
    options:
      cache: false
      shell: false
      envOverride: true
  dep-age:
    description: 'Enforce the 7-day minimum release age of every Go module, including tool modules'
    script: |
      set -euo pipefail
      min_age_days=7
      cutoff_epoch=$(($(date -u +%s) - min_age_days * 86400))
      cutoff="$(date -u -d "@${cutoff_epoch}" +%FT%TZ 2>/dev/null || date -u -r "$cutoff_epoch" +%FT%TZ)"
      format='2006-01-02T15:04:05Z'
      template="{{if and (not .Main) .Time}}{{.Path}} {{.Version}} {{.Time.UTC.Format \"${format}\"}} {{(.Time.AddDate 0 0 ${min_age_days}).UTC.Format \"${format}\"}}{{end}}"
      echo "Module versions published after ${cutoff} are younger than ${min_age_days} days."
      status=0
      for directory in . tools/actionlint tools/govulncheck; do
        if ! listing="$(GOWORK=off go -C "$directory" list -m -f "$template" all)"; then
          echo "Could not list dependencies of ${directory}/go.mod. Fix the Go/proxy error above, then rerun moon run hump:dep-age." >&2
          status=1
          continue
        fi
        while read -r module version published allowed; do
          [[ -n "$module" && "$published" > "$cutoff" ]] || continue
          echo "${directory}/go.mod: ${module} ${version} was published ${published}; allowed from ${allowed}."
          echo "Pick a version at least ${min_age_days} days old (go list -m -json ${module}@<version>), run GOWORK=off go -C ${directory} get ${module}@<version> and moon run hump:tidy, or wait until ${allowed}." >&2
          status=1
        done <<<"$listing"
      done
      exit "$status"
    inputs: ['go.mod', 'go.sum', 'tools/actionlint/go.mod', 'tools/actionlint/go.sum', 'tools/govulncheck/go.mod', 'tools/govulncheck/go.sum']
    options:
      cache: false
