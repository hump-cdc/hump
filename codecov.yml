# https://docs.codecov.com/docs/codecov-yaml
# Coverage is uploaded by .github/workflows/go-test.yml (flag 'go') and
# .github/workflows/web-test.yml (flag 'webui').
coverage:
    precision: 1
    round: down
    status:
        # Fails a PR that lowers total coverage by more than 1 point against its base commit.
        # The threshold absorbs noise from timing-dependent code paths.
        project:
            default:
                target: auto
                threshold: 1%
        # Lines added or changed in a PR must be at least 80% covered, a bit above the current
        # total, so new code raises the average instead of following it down.
        patch:
            default:
                target: 80%

# Each language is tracked under its own flag, with the same project and patch rules as the
# totals above, so a drop in one is not hidden by the other. Carryforward keeps a flag's last
# report when a commit has no upload for it (a cancelled or failed run), instead of the total
# losing that language's coverage.
flag_management:
    default_rules:
        carryforward: true
        statuses:
            - type: project
              target: auto
              threshold: 1%
            - type: patch
              target: 80%
    individual_flags:
        # No 'paths': each flag only receives its own workflow's upload.
        - name: go
        - name: webui

comment:
    layout: "diff, flags, files"
    behavior: default
    require_changes: false

# Bun writes lcov paths relative to web/webui; map them to repository paths.
fixes:
    - "src/::web/webui/src/"
    - "app/::web/webui/app/"

# Keep in sync with the profile filter in .github/workflows/go-test.yml and the
# coveragePathIgnorePatterns in web/webui/bunfig.toml (and with the 'excluded' input of the job
# summary step in each test workflow).
ignore:
    # Writes the OpenAPI spec at build time; not part of the shipped binary.
    - "cmd/openapi"
    # Generated by 'bun run generate:openapi'.
    - "web/webui/src/shared/api/generated"
    # Test-only doubles.
    - "web/webui/**/*.fake.ts"
