# https://docs.codecov.com/docs/codecov-yaml
# Coverage is uploaded by .github/workflows/ci-check.yml (flags 'go' and 'hump-tower').
coverage:
    precision: 1
    round: down
    status:
        # Fails a PR that lowers total coverage by more than 1 point against its base commit.
        # The threshold absorbs noise from timing-dependent code paths.
        project:
            default:
                target: auto
                threshold: 1%
        # Lines added or changed in a PR must be at least 80% covered, a bit above the current
        # total, so new code raises the average instead of following it down.
        patch:
            default:
                target: 80%

# Each language is tracked under its own flag, with the same project and patch rules as the
# totals above, so a drop in one is not hidden by the other. Carryforward keeps a flag's last
# report when a commit has no upload for it (a cancelled or failed run), instead of the total
# losing that language's coverage.
flag_management:
    default_rules:
        carryforward: true
        statuses:
            - type: project
              target: auto
              threshold: 1%
            - type: patch
              target: 80%
    individual_flags:
        # No 'paths': each flag only receives its own upload.
        - name: go
        - name: hump-tower

# Components split the totals by module, so the PR comment shows each module's coverage and its
# change against base, and a drop is easy to trace. They are display-only: 'statuses: []' adds
# no checks. To gate a module, give its entry 'statuses' (same shape as in flag_management).
# Paths are prefixes of repository paths ('!' excludes); within a flag they must not overlap,
# and a new top-level code directory needs a component, or it is left out of the table.
component_management:
    default_rules:
        statuses: []
    individual_components:
        # Go (flag 'go').
        - component_id: go_cmd
          name: "Go · cmd"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/cmd/"]
        - component_id: go_config
          name: "Go · config"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/config/"]
        - component_id: go_domain_port
          name: "Go · domain & ports"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/domain/", "apps/hump/internal/port/"]
        - component_id: go_adapter_postgres
          name: "Go · adapters/postgres"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/adapter/postgres/"]
        - component_id: go_adapter_sink
          name: "Go · adapters/sink"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/adapter/sink/"]
        - component_id: go_adapter_other
          name: "Go · adapters (other)"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/adapter/", "!apps/hump/internal/adapter/postgres/", "!apps/hump/internal/adapter/sink/"]
        - component_id: go_application
          name: "Go · application"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/application/"]
        - component_id: go_controller
          name: "Go · controller"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/internal/controller/"]
        - component_id: go_pkg
          name: "Go · pkg"
          flag_regexes: ["^go$"]
          paths: ["apps/hump/pkg/"]
        # hump-tower (flag 'hump-tower').
        - component_id: hump_tower_shared_ui
          name: "Hump Tower · shared/ui"
          flag_regexes: ["^hump-tower$"]
          paths: ["apps/hump-tower/src/shared/ui/"]
        - component_id: hump_tower_shared
          name: "Hump Tower · shared (other)"
          flag_regexes: ["^hump-tower$"]
          paths: ["apps/hump-tower/src/shared/", "!apps/hump-tower/src/shared/ui/"]
        - component_id: hump_tower_entities
          name: "Hump Tower · entities"
          flag_regexes: ["^hump-tower$"]
          paths: ["apps/hump-tower/src/entities/"]
        - component_id: hump_tower_app
          name: "Hump Tower · app, pages, widgets & features"
          flag_regexes: ["^hump-tower$"]
          paths:
              - "apps/hump-tower/app/"
              - "apps/hump-tower/src/app/"
              - "apps/hump-tower/src/pages/"
              - "apps/hump-tower/src/widgets/"
              - "apps/hump-tower/src/features/"

comment:
    layout: "diff, flags, components, files"
    behavior: default
    require_changes: false

# Go profile paths start with the module path 'hump/', and Bun writes lcov paths relative to
# apps/hump-tower; map both to repository paths.
fixes:
    - "hump/::apps/hump/"
    - "src/::apps/hump-tower/src/"
    - "app/::apps/hump-tower/app/"

# Keep in sync with the profile filter in scripts/hump-ci.sh and the
# coveragePathIgnorePatterns in apps/hump-tower/bunfig.toml (and with the 'excluded' inputs of the
# coverage summary steps in .github/workflows/ci-check.yml).
ignore:
    # Writes the OpenAPI spec at build time; not part of the shipped binary.
    - "apps/hump/cmd/openapi"
    # Generated by 'bun run generate:openapi'.
    - "apps/hump-tower/src/shared/api/generated"
    # Test-only doubles.
    - "apps/hump-tower/**/*.fake.ts"
