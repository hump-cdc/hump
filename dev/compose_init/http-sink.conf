split_clients "${request_id}" $submit2_fail {
    5% "";
    *  "1";
}

server {
    listen 80;

    location = /submit1 {
        content_by_lua_block {
            ngx.sleep(0.05)
            ngx.exit(200)
        }
    }

    location = /submit2 {
        client_body_buffer_size 10m;
        content_by_lua_block {
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                local path = ngx.req.get_body_file()
                if path then
                    local f = io.open(path, "rb")
                    body = f:read("*a")
                    f:close()
                end
            end
            io.stdout:write((body or ""), "\n")
            io.stdout:flush()
            ngx.sleep(1.5)
            ngx.exit(ngx.var.submit2_fail == "1" and 500 or 200)
        }
    }

    location = /submit3 {
        content_by_lua_block {
            ngx.sleep(0.075)
            ngx.exit(500)
        }
    }

    location = /submit4 {
        client_body_buffer_size 10m;
        content_by_lua_block {
            ngx.req.read_body()
            io.stdout:write("submit4: processing request, waiting 15s...\n")
            io.stdout:flush()
            ngx.sleep(15)
            local body = ngx.req.get_body_data()
            if not body then
                local path = ngx.req.get_body_file()
                if path then
                    local f = io.open(path, "rb")
                    body = f:read("*a")
                    f:close()
                end
            end
            io.stdout:write((body or ""), "\n")
            io.stdout:flush()
            ngx.exit(200)
        }
    }
}
