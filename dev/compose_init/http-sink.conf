split_clients "${request_id}" $submit2_fail {
    50% "";
    *   "1";
}

server {
    listen 80;

    location = /submit1 {
        content_by_lua_block {
            ngx.sleep(0.05)
            ngx.exit(200)
        }
    }

    location = /submit2 {
        content_by_lua_block {
            ngx.sleep(0.025)
            ngx.exit(ngx.var.submit2_fail == "1" and 500 or 200)
        }
    }

    location = /submit3 {
        content_by_lua_block {
            ngx.sleep(0.075)
            ngx.exit(500)
        }
    }
}
