name: hump

x-pg-env: &pg-env
    POSTGRES_USER: hump
    POSTGRES_PASSWORD: hump
    POSTGRES_DB: hump

x-pg-command: &pg-command
    command:
        - postgres
        - -c
        - shared_preload_libraries=timescaledb
        - -c
        - wal_level=logical
        - -c
        - max_wal_senders=10
        - -c
        - max_replication_slots=10

services:
    # Postgres
    postgres-15:
        image: timescale/timescaledb:latest-pg15
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5435:5432"
        volumes:
            - pg15-data:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-16:
        image: timescale/timescaledb:latest-pg16
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5436:5432"
        volumes:
            - pg16-data:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-17:
        image: timescale/timescaledb:latest-pg17
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5437:5432"
        volumes:
            - pg17-data:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-18:
        image: timescale/timescaledb:latest-pg18
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5438:5432"
        volumes:
            - pg18-data:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    # Kafka
    kafka:
        image: apache/kafka:latest
        restart: unless-stopped
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            CLUSTER_ID: hump-dev-cluster-0
        volumes:
            - kafka-data:/var/lib/kafka/data

    kafka-init:
        image: apache/kafka:latest
        depends_on:
            - kafka
        restart: "no"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
                  echo "waiting for kafka..."
                  sleep 2
                done
                for topic in users posts comments events; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
                    --create --if-not-exists --topic "$$topic" \
                    --partitions 1 --replication-factor 1
                done

    # NATS
    nats:
        image: nats:2.14.0
        restart: unless-stopped
        ports:
            - "4222:4222"
            - "8222:8222"
            - "6222:6222"
        command: "-js -sd /data --user hump --pass hump"
        volumes:
            - nats-data:/data

    nats2:
        image: nats:2.14.0
        restart: unless-stopped
        ports:
            - "4223:4222"
            - "8223:8222"
            - "6223:6222"
        command: "-js -sd /data --user hump --pass hump"
        volumes:
            - nats2-data:/data

    # RabbitMQ (classic AMQP + Streams)
    rabbitmq:
        image: rabbitmq:4-management
        restart: unless-stopped
        hostname: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
            - "5552:5552"
        environment:
            RABBITMQ_DEFAULT_USER: hump
            RABBITMQ_DEFAULT_PASS: hump
            RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_stream advertised_host localhost"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
            - ./initdb/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro

    # Declares the classic-AMQP exchange and binds a catch-all demo queue
    rabbitmq-init:
        image: rabbitmq:4-management
        depends_on:
            - rabbitmq
        restart: "no"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                RMQ="rabbitmqadmin --host=rabbitmq --username=hump --password=hump --non-interactive"
                until $$RMQ show overview >/dev/null 2>&1; do
                  echo "waiting for rabbitmq..."
                  sleep 2
                done
                $$RMQ declare exchange --name hump.public --type topic --durable true
                $$RMQ declare queue --name hump.public.demo --durable true
                $$RMQ declare binding --source hump.public --destination-type queue \
                  --destination hump.public.demo --routing-key '#'

volumes:
    pg15-data:
    pg16-data:
    pg17-data:
    pg18-data:
    kafka-data:
    nats-data:
    nats2-data:
    rabbitmq-data:
