name: hump

x-pg-env: &pg-env
    POSTGRES_USER: hump
    POSTGRES_PASSWORD: hump
    POSTGRES_DB: hump

x-pg-command: &pg-command
    command:
        - postgres
        - -c
        - shared_preload_libraries=timescaledb
        - -c
        - wal_level=logical
        - -c
        - max_wal_senders=10
        - -c
        - max_replication_slots=10

services:
    # Postgres
    postgres-15:
        image: timescale/timescaledb:2.28.3-pg15@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5435:5432"
        volumes:
            - pg15-data:/var/lib/postgresql/data
            - ./compose_init:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-16:
        image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5436:5432"
        volumes:
            - pg16-data:/var/lib/postgresql/data
            - ./compose_init:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-17:
        image: timescale/timescaledb:2.30.2-pg17@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5437:5432"
        volumes:
            - pg17-data:/var/lib/postgresql/data
            - ./compose_init:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    postgres-18:
        image: timescale/timescaledb:2.30.2-pg18@sha256:e72689191e1c977892c53d6f2c344dbc4a9657a867dc8cc1899229f9d3672b2e
        restart: unless-stopped
        environment: *pg-env
        ports:
            - "5438:5432"
        volumes:
            - pg18-data:/var/lib/postgresql/data
            - ./compose_init:/docker-entrypoint-initdb.d:ro
        <<: *pg-command

    # Kafka
    kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        restart: unless-stopped
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            CLUSTER_ID: hump-dev-cluster-0
        volumes:
            - kafka-data:/var/lib/kafka/data

    kafka-init:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        depends_on:
            - kafka
        restart: "no"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
                  echo "waiting for kafka..."
                  sleep 2
                done
                for topic in users posts comments events; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
                    --create --if-not-exists --topic "$$topic" \
                    --partitions 1 --replication-factor 1
                done

    # NATS
    nats:
        image: nats:2.15.0@sha256:cd3fcd4ecdda44e3a66728a5334af0a959bc3979b32810e033d1c547241cd0f4
        restart: unless-stopped
        ports:
            - "4222:4222"
            - "8222:8222"
            - "6222:6222"
        command: "-js -sd /data --user hump --pass hump"
        volumes:
            - nats-data:/data

    nats2:
        image: nats:2.15.0@sha256:cd3fcd4ecdda44e3a66728a5334af0a959bc3979b32810e033d1c547241cd0f4
        restart: unless-stopped
        ports:
            - "4223:4222"
            - "8223:8222"
            - "6223:6222"
        command: "-js -sd /data --user hump --pass hump"
        volumes:
            - nats2-data:/data

    # RabbitMQ (classic AMQP + Streams)
    rabbitmq:
        image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
        restart: unless-stopped
        hostname: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
            - "5552:5552"
        environment:
            RABBITMQ_DEFAULT_USER: hump
            RABBITMQ_DEFAULT_PASS: hump
            RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_stream advertised_host localhost"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
            - ./compose_init/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro

    # Declares the classic-AMQP exchange and binds a catch-all demo queue
    rabbitmq-init:
        image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
        depends_on:
            - rabbitmq
        restart: "no"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                RMQ="rabbitmqadmin --host=rabbitmq --username=hump --password=hump --non-interactive"
                until $$RMQ show overview >/dev/null 2>&1; do
                  echo "waiting for rabbitmq..."
                  sleep 2
                done
                $$RMQ declare exchange --name hump.public --type topic --durable true
                $$RMQ declare queue --name hump.public.demo --durable true
                $$RMQ declare binding --source hump.public --destination-type queue \
                  --destination hump.public.demo --routing-key '#'

    # HTTP sink target: /submit1 → 200, /submit2 → 5/95 200/500 after 950ms, logs body, /submit3 → 500
    http-sink:
        image: openresty/openresty:1.31.1.1-4-alpine@sha256:52ff9a6e337bd0138745c73cdfeb5aaa0e783e29eeec0695eec6971c1231f3bd
        restart: unless-stopped
        ports:
            - "5050:80"
        volumes:
            - ./compose_init/http-sink.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
    pg15-data:
    pg16-data:
    pg17-data:
    pg18-data:
    kafka-data:
    nats-data:
    nats2-data:
    rabbitmq-data:
