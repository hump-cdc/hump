# headers:
#     X-Idempotency-Key: "{{ sha256 (cat .Schema .Table .Operation .Timestamp (.Prev | json) (.Next | json)) }}"
#     X-TraceParent: '{{index .Headers "traceparent"}}'
sinks:
    - name: kafka1
      kafka:
          url: '{{ env "KAFKA_HOST" }}'
          topic: "{{.Table}}"
          partitionKey: "{{coalesce .Next.id .Prev.id}}"
    - name: nats-core
      nats-core:
          url: '{{ env "NATS_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.{{.Schema}}.{{.Table}}"
    - name: nats-jetstream
      nats-jetstream:
          url: '{{ env "NATS_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.js.{{.Schema}}.{{.Table}}"
          stream:
              name: HUMP
              subjects:
                  - "hump.js.>"
          retention: limits
          storage: file
    - name: nats2-core
      nats-core:
          url: '{{ env "NATS2_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.{{.Schema}}.{{.Table}}"
    - name: nats2-jetstream
      nats-jetstream:
          url: '{{ env "NATS2_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.js.{{.Schema}}.{{.Table}}"
          stream:
              name: HUMP
              subjects:
                  - "hump.js.>"
          retention: limits
          storage: file
    - name: rabbitmq1
      rabbitmq:
          url: '{{ env "RABBITMQ_URL" }}'
          exchange:
              name: "hump.{{.Schema}}"
              type: topic
          routingKey: "{{.Schema}}.{{.Table}}"
    - name: rabbitmq-stream
      rabbitmq-stream:
          url: '{{ env "RABBITMQ_STREAM_URL" }}'
          stream:
              name: "hump.{{.Schema}}.{{.Table}}"
    - name: http1
      http:
          url: "http://localhost:5050/submit1?schema={{.Schema}}&table={{.Table}}"
          method: "POST"
      failure: skip
      retry:
          maxAttempts: 10
          attemptTimeout: 50ms
          backoff:
              max: 50ms
    - name: http2
      http:
          url: "http://localhost:5050/submit2?schema={{.Schema}}&table={{.Table}}"
          method: "POST"
      failure: skip
      retry:
          maxAttempts: 10
          attemptTimeout: 50ms
          backoff:
              max: 50ms
    - name: slow-http
      http:
          url: "http://localhost:5050/submit4?schema={{.Schema}}&table={{.Table}}"
          method: "POST"
      failure: skip
      retry:
          maxAttempts: 50
          attemptTimeout: 35000ms
          backoff:
              max: 1500ms

