# headers:
#     X-Idempotency-Key: "{{ sha256 (cat .Schema .Table .Operation .Timestamp (.Prev | json) (.Next | json)) }}"
#     X-TraceParent: '{{index .Headers "traceparent"}}'
sinks:
    - name: kafka1
      kafka:
          url: '{{ env "KAFKA_HOST" }}'
          topic: "{{.Table}}"
          partitionKey: "{{coalesce .Next.id .Prev.id}}"
    - name: nats-core
      nats-core:
          url: '{{ env "NATS_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.{{.Schema}}.{{.Table}}"
    - name: nats-jetstream
      nats-jetstream:
          url: '{{ env "NATS_URL" }}'
          username: "hump"
          password: "hump"
          subject: "hump.js.{{.Schema}}.{{.Table}}"
          stream:
              name: HUMP
              subjects:
                  - "hump.js.>"
          retention: limits
          storage: file
    - name: rabbitmq1
      rabbitmq:
          url: '{{ env "RABBITMQ_URL" }}'
          exchange:
              name: "hump.{{.Schema}}"
              type: topic
          routingKey: "{{.Schema}}.{{.Table}}"
      # delivery:
      # mode: async
      # maxConcurrent: 10
      # concurrencyKey: test
    - name: rabbitmq-stream
      rabbitmq-stream:
          url: '{{ env "RABBITMQ_STREAM_URL" }}'
          stream:
              name: "hump.{{.Schema}}.{{.Table}}"
    - name: http1
      http:
          url: "http://localhost:3050/submit"
          method: "POST"
      failure: skip
      delivery:
          mode: async
          maxConcurrent: 3

tables:
    - tables:
          - schema: public
            table: users
          - schema: public
            table: posts
          - schema: public
            table: comments
          - schema: public
            table: events
