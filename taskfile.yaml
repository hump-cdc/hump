version: '3'

vars:
    VERSION: 0.0.0
    COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
    DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    LDFLAGS: -s -w -X hump/pkg/version.Version={{.VERSION}} -X hump/pkg/version.Commit={{.COMMIT}} -X hump/pkg/version.Date={{.DATE}}
    # Fallback only: DATABASE_URL from the caller's environment (Zed task env) wins.
    DATABASE_URL: '{{env "DATABASE_URL" | default "postgres://hump:hump@localhost:5437/hump?sslmode=disable"}}'

env:
    CGO_ENABLED: '0'

tasks:
    openapi:
        desc: Generate OpenAPI spec for the web UI
        env:
            OPENAPI_OUT: '{{.ROOT_DIR}}/web/webui/src/shared/api/openapi.json'
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/openapi

    web:build:
        desc: Build the web UI into the embedded webui directory
        deps: [openapi]
        dir: web/webui
        env:
            NODE_ENV: production
            VERSION: '{{.VERSION}}'
        cmds:
            - bun run build

    web:dev:
        desc: Run the web UI dev server
        deps: [openapi]
        dir: web/webui
        env:
            API_URL: http://localhost:3200
        cmds:
            - bun run dev

    web:storybook:
        desc: Run the web UI Storybook
        dir: web/webui
        cmds:
            - bun run storybook

    build:
        desc: Build the hump binary with the embedded web UI
        deps: [web:build]
        cmds:
            - go build -ldflags "{{.LDFLAGS}}" -o ./bin/hump ./cmd/hump

    run:
        desc: Run hump against the dev environment
        deps: [web:build]
        env:
            DATABASE_URL: '{{.DATABASE_URL}}'
            LOG_VERBOSE: 'false'
            LOG_FORMAT: pretty
            CORS: http://localhost:3000
            KAFKA_HOST: localhost:9092
            NATS_URL: nats://localhost:4222
            RABBITMQ_URL: amqp://hump:hump@localhost:5672/
            RABBITMQ_STREAM_URL: rabbitmq-stream://hump:hump@localhost:5552/%2F
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/hump -f dev/hump.yaml -t 9100 -w 3200

    run:cleanup:
        desc: Remove hump replication artifacts from the dev database
        env:
            DATABASE_URL: '{{.DATABASE_URL}}'
            LOG_VERBOSE: 'false'
            LOG_FORMAT: pretty
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/hump -f dev/hump.yaml --cleanup

    test:
        desc: Run all tests
        cmds:
            - gotestsum --format testdox ./...

    test:file:
        desc: Run tests of the package in the current directory
        dir: '{{.USER_WORKING_DIR}}'
        cmds:
            - gotestsum --format testdox

    test:cover:
        desc: Run all tests with coverage report
        cmds:
            - task: _cover
              vars:
                  ARGS: -coverpkg=./... ./...

    test:file:cover:
        desc: Run tests of the package in the current directory with coverage report
        cmds:
            - task: _cover
              vars:
                  DIR: '{{.USER_WORKING_DIR}}'

    _cover:
        internal: true
        dir: '{{.DIR}}'
        vars:
            DIR: '{{.DIR | default .ROOT_DIR}}'
            ARGS: '{{.ARGS | default ""}}'
        cmds:
            - defer: rm -f cover.out
            - gotestsum --format testdox -- -coverprofile=cover.out {{.ARGS}}
            - gocov convert cover.out | gocov-html > "${TMPDIR:-/tmp}/hump-cover.html"
            - open "${TMPDIR:-/tmp}/hump-cover.html"
