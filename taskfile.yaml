version: '3'

vars:
    VERSION: 0.0.0
    COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
    DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    LDFLAGS: -s -w -X hump/pkg/version.Version={{.VERSION}} -X hump/pkg/version.Commit={{.COMMIT}} -X hump/pkg/version.Date={{.DATE}}
    # Fallback only: DATABASE_URL from the caller's environment (Zed task env) wins.
    DATABASE_URL: '{{env "DATABASE_URL" | default "postgres://hump:hump@localhost:5437/hump?sslmode=disable"}}'
    TELEMETRY_PORT: '{{env "TELEMETRY_PORT" | default "9100"}}'
    WEB_PORT: '{{env "WEB_PORT" | default "3200"}}'

env:
    CGO_ENABLED: '0'

tasks:
    openapi:
        desc: Generate OpenAPI spec for the web UI
        env:
            OPENAPI_OUT: '{{.ROOT_DIR}}/web/webui/src/shared/api/openapi.json'
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/openapi

    web:build:
        desc: Build the web UI into the embedded webui directory
        deps: [openapi]
        dir: web/webui
        env:
            NODE_ENV: production
            VERSION: '{{.VERSION}}'
        cmds:
            - bun run build

    web:dev:
        desc: Run the web UI dev server
        deps: [openapi]
        dir: web/webui
        env:
            API_URL: http://localhost:3200
        cmds:
            - bun run dev

    web:storybook:
        desc: Run the web UI Storybook
        dir: web/webui
        cmds:
            - bun run storybook

    build:
        desc: Build the hump binary with the embedded web UI
        deps: [web:build]
        cmds:
            - go build -ldflags "{{.LDFLAGS}}" -o ./bin/hump ./cmd/hump

    run:
        desc: Run hump against the dev environment
        deps: [web:build]
        env:
            DATABASE_URL: '{{.DATABASE_URL}}'
            TELEMETRY_PORT: '{{.TELEMETRY_PORT}}'
            WEB_PORT: '{{.WEB_PORT}}'
            LOG_VERBOSE: 'false'
            LOG_FORMAT: pretty
            CORS: http://localhost:3000
            KAFKA_HOST: localhost:9092
            NATS_URL: nats://localhost:4222
            NATS2_URL: nats://localhost:4223
            RABBITMQ_URL: amqp://hump:hump@localhost:5672/
            RABBITMQ_STREAM_URL: rabbitmq-stream://hump:hump@localhost:5552/%2F
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/hump -f dev/hump.yaml

    run:cleanup:
        desc: Remove hump replication artifacts from the dev database
        env:
            DATABASE_URL: '{{.DATABASE_URL}}'
            LOG_VERBOSE: 'false'
            LOG_FORMAT: pretty
        cmds:
            - go run -ldflags "{{.LDFLAGS}}" ./cmd/hump -f dev/hump.yaml --cleanup

    dev:up:
        desc: Start the dev environment (PostgreSQL, Kafka, NATS, RabbitMQ, HTTP sink)
        cmds:
            - docker compose -f dev/docker-compose.yml up -d

    dev:down:
        desc: Stop the dev environment
        cmds:
            - docker compose -f dev/docker-compose.yml down

    dev:reset:
        desc: Recreate the dev environment from scratch, removing its volumes
        cmds:
            - docker compose -f dev/docker-compose.yml down -v
            - docker compose -f dev/docker-compose.yml up -d

    test:
        desc: Run all tests
        cmds:
            - go tool gotestsum --format testdox ./...

    lint:
        desc: Run golangci-lint
        cmds:
            - go tool golangci-lint run

    lint:fix:
        desc: Run golangci-lint and apply automatic fixes
        cmds:
            - go tool golangci-lint run --fix

    fmt:
        desc: Format Go code (gofmt, goimports)
        cmds:
            - go tool golangci-lint fmt

    check:
        desc: Run all pre-PR checks (golangci-lint, tests, web UI lint, tests and type check)
        cmds:
            - task: lint
            - task: test
            - task: _check:web

    _check:web:
        internal: true
        dir: web/webui
        cmds:
            - bun run check
            - bun test
            - bunx tsc --noEmit

    test:file:
        desc: Run tests of the package in the current directory
        dir: '{{.USER_WORKING_DIR}}'
        cmds:
            - go tool gotestsum --format testdox

    test:cover:
        desc: Run all tests with coverage report
        cmds:
            - task: _cover
              vars:
                  ARGS: -coverpkg=./... ./...

    test:file:cover:
        desc: Run tests of the package in the current directory with coverage report
        cmds:
            - task: _cover
              vars:
                  DIR: '{{.USER_WORKING_DIR}}'

    _cover:
        internal: true
        dir: '{{.DIR}}'
        vars:
            DIR: '{{.DIR | default .ROOT_DIR}}'
            ARGS: '{{.ARGS | default ""}}'
        cmds:
            - defer: rm -f cover.out
            - go tool gotestsum --format testdox -- -coverprofile=cover.out {{.ARGS}}
            - go tool gocov convert cover.out | go tool gocov-html > "${TMPDIR:-/tmp}/hump-cover.html"
            - '{{if eq OS "darwin"}}open{{else if eq OS "windows"}}cmd /c start ""{{else}}xdg-open{{end}} "${TMPDIR:-/tmp}/hump-cover.html"'
