[install]
# Skip npm versions published less than 7 days ago (matches the Dependabot cooldown).
minimumReleaseAge = 604800
# Save exact versions (no ^ or ~) when adding packages.
exact = true

[test]
# Keep the coverage total about the code written here, locally and in CI
# (.github/workflows/web-test.yml). Test files are skipped too (coverageSkipTestFiles).
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    # Generated by 'bun run generate:openapi' from openapi.json.
    "src/shared/api/generated/**",
    # Test-only doubles, imported only by *.test.* files.
    "**/*.fake.ts",
]
